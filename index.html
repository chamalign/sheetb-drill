class=\"gap\">②</span>）で特定の用途を制限する。", "back": "特定用途制限地域＝ <mark>用途地域が定められていない土地の区域</mark>（<mark>市街化調整区域を除く</mark>）で特定の用途を制限する。", "kind": "cloze", "id": "c373"}, {"sec": 26, "sub": "地域地区", "front": "第一種・第二種低層住居専用地域、田園住居地域では、都市計画に<span class=\"gap\">①</span> を定める。", "back": "第一種・第二種低層住居専用地域、田園住居地域では、都市計画に<mark>容積率・建蔽率・高さの限度</mark> を定める。", "kind": "cloze", "id": "c374"}, {"sec": 26, "sub": "手続・行為制限（第1回 問15）", "front": "市町村が都市計画を決定するときは、あらかじめ知事に <span class=\"gap\">①</span> する。<span class=\"gap\">②</span>。", "back": "市町村が都市計画を決定するときは、あらかじめ知事に <mark>協議</mark> する。<mark>同意は不要</mark>。", "kind": "cloze", "id": "c375"}, {"sec": 26, "sub": "手続・行為制限（第1回 問15）", "front": "田園住居地域内の農地の区域内で土地の形質変更・建築物の建築等を行うには、<span class=\"gap\">①</span> の許可が必要。", "back": "田園住居地域内の農地の区域内で土地の形質変更・建築物の建築等を行うには、<mark>市町村長</mark> の許可が必要。", "kind": "cloze", "id": "c376"}, {"sec": 26, "sub": "手続・行為制限（第1回 問15）", "front": "都市計画事業の <span class=\"gap\">①</span> 後、事業地内で事業の施行の障害となるおそれのある土地の形質変更等を行うには、<span class=\"gap\">②</span> の許可が必要。", "back": "都市計画事業の <mark>認可の告示</mark> 後、事業地内で事業の施行の障害となるおそれのある土地の形質変更等を行うには、<mark>都道府県知事（市の区域内では市長）</mark> の許可が必要。", "kind": "cloze", "id": "c377"}, {"sec": 26, "sub": "手続・行為制限（第1回 問15）", "front": "<span class=\"gap\">①</span> 等の区域内で建築等を行う者は、着手の <span class=\"gap\">②</span> までに<span class=\"gap\">③</span> へ届け出る（＝第1回 問15の正解）。", "back": "<mark>地区計画</mark> 等の区域内で建築等を行う者は、着手の <mark>30日前</mark> までに<mark>市町村長</mark> へ届け出る（＝第1回 問15の正解）。", "kind": "cloze", "id": "c378"}, {"sec": 27, "sub": "", "front": "1号（内容・必要な区域）", "back": "<span class=\"k\">内容：</span><b>特殊建築物</b>で用途部分の床面積 <b>200㎡超</b><br><span class=\"k\">必要な区域：</span>全国", "kind": "row", "id": "c379"}, {"sec": 27, "sub": "", "front": "2号（内容・必要な区域）", "back": "<span class=\"k\">内容：</span>1号以外で、<b>階数2以上</b>または<b>延べ200㎡超</b>（<b>木造・非木造の区別なし</b>）<br><span class=\"k\">必要な区域：</span>全国", "kind": "row", "id": "c380"}, {"sec": 27, "sub": "", "front": "3号（内容・必要な区域）", "back": "<span class=\"k\">内容：</span>上記以外（<b>平屋かつ200㎡以下</b>）<br><span class=\"k\">必要な区域：</span><b>都市計画区域・準都市計画区域等の内のみ</b>", "kind": "row", "id": "c381"}, {"sec": 27, "sub": "", "front": "新築", "back": "1号・2号・3号すべて", "kind": "row", "id": "c382"}, {"sec": 27, "sub": "", "front": "増改築・移転", "back": "1〜3号。ただし<b>防火・準防火地域外</b>での <b>10㎡以内</b>は不要", "kind": "row", "id": "c383"}, {"sec": 27, "sub": "", "front": "大規模の修繕・模様替", "back": "<b>1号・2号のみ</b>（3号は不要）", "kind": "row", "id": "c384"}, {"sec": 27, "sub": "", "front": "用途変更", "back": "<b>1号のみ</b>（<b>類似用途間は不要</b>）", "kind": "row", "id": "c385"}, {"sec": 27, "sub": "", "front": "完了検査の申請", "back": "工事完了日から <b>4日以内に到達</b>するように", "kind": "row", "id": "c386"}, {"sec": 27, "sub": "", "front": "検査済証の交付前の使用", "back": "1号・2号は原則不可（仮使用認定、または<b>完了検査の申請受理から7日経過</b>で可）。3号は可", "kind": "row", "id": "c387"}, {"sec": 27, "sub": "", "front": "都市計画区域内で新築するとき、規模による例外はあるか", "back": "<b>ない。規模・用途を問わずすべての建築物に確認が必要</b>（平屋10㎡の物置でも必要）", "kind": "row", "id": "c388"}, {"sec": 27, "sub": "", "front": "住宅の居室の採光", "back": "採光に有効な開口部の面積は、原則として居室の床面積の<b>7分の1</b>以上", "kind": "row", "id": "c389"}, {"sec": 28, "sub": "", "front": "接道義務", "back": "敷地は道路に <b>2m以上</b>接する（道路は原則幅員4m以上）", "kind": "row", "id": "c390"}, {"sec": 28, "sub": "", "front": "敷地が2以上の用途地域にわたる", "back": "用途制限は敷地の<b>過半</b>が属する地域の規定による", "kind": "row", "id": "c391"}, {"sec": 28, "sub": "", "front": "敷地が2以上の地域にわたる建蔽率・容積率", "back": "面積の割合で<b>加重平均</b>する", "kind": "row", "id": "c392"}, {"sec": 28, "sub": "", "front": "建築物が防火地域と準防火地域にわたる", "back": "原則として<b>全部に防火地域</b>の規定（防火壁で区画された部分を除く）", "kind": "row", "id": "c393"}, {"sec": 28, "sub": "", "front": "敷地面積の最低限度", "back": "用途地域の都市計画で定めるときは <b>200㎡以下</b>", "kind": "row", "id": "c394"}, {"sec": 28, "sub": "", "front": "第一種低層住居専用地域の兼用住宅", "back": "延べ面積の<b>2分の1以上</b>が居住用で、理髪店・美容院などの店舗部分が<b>50㎡以内</b>なら建てられる", "kind": "row", "id": "c395"}, {"sec": 28, "sub": "", "front": "道路内の建築", "back": "原則できない。巡査派出所・公衆便所などは、特定行政庁が建築審査会の同意を得て<b>許可</b>すればできる", "kind": "row", "id": "c396"}, {"sec": 29, "sub": "", "front": "規制区域を指定できる範囲", "back": "<b>都市計画区域の内外を問わない</b>", "kind": "row", "id": "c397"}, {"sec": 29, "sub": "", "front": "盛土で崖ができる", "back": "高さ <b>1m超</b>", "kind": "row", "id": "c398"}, {"sec": 29, "sub": "", "front": "切土で崖ができる", "back": "高さ <b>2m超</b>", "kind": "row", "id": "c399"}, {"sec": 29, "sub": "", "front": "盛土＋切土で崖ができる", "back": "高さ <b>2m超</b>", "kind": "row", "id": "c400"}, {"sec": 29, "sub": "", "front": "盛土（崖ができない）", "back": "高さ <b>2m超</b>", "kind": "row", "id": "c401"}, {"sec": 29, "sub": "", "front": "上記以外（面積）", "back": "<b>500㎡超</b>", "kind": "row", "id": "c402"}, {"sec": 29, "sub": "", "front": "土石の堆積", "back": "高さ2m超<b>かつ</b>面積300㎡超、<b>または</b>面積500㎡超", "kind": "row", "id": "c403"}, {"sec": 29, "sub": "", "front": "区域指定前に着手していた工事", "back": "指定日から <b>21日以内</b>に届出", "kind": "row", "id": "c404"}, {"sec": 29, "sub": "", "front": "資格者の設計が必要な場合", "back": "高さ <b>5m超</b>の擁壁／盛土切土面積 <b>1,500㎡超</b>の土地の排水施設", "kind": "row", "id": "c405"}, {"sec": 29, "sub": "", "front": "許可を受けた後の変更", "back": "原則は<b>変更の許可</b>。工事主・施行者・<b>設計者</b>の変更、着手・完了予定日の変更などの<b>軽微な変更</b>は遅滞なく<b>届出</b>", "kind": "row", "id": "c406"}, {"sec": 29, "sub": "", "front": "届出で足りる工事", "back": "擁壁・排水施設等の<b>除却</b>工事は着手の <b>14日前</b>までに届出／公共施設用地を宅地に転用したときは転用後 <b>14日以内</b>に届出", "kind": "row", "id": "c407"}, {"sec": 29, "sub": "", "front": "土地の所有者等の義務", "back": "所有者・管理者・占有者は、土地を<b>常時安全な状態に維持</b>するよう努める（工事主と別の者でも同じ）", "kind": "row", "id": "c408"}, {"sec": 29, "sub": "", "front": "許可の条件", "back": "知事は許可に<b>条件</b>を付けられ、条件に違反した者の許可を<b>取り消せる</b>", "kind": "row", "id": "c409"}, {"sec": 30, "sub": "", "front": "免許の種類", "back": "2以上の都道府県に事務所 → <b>国土交通大臣</b>免許／1つの都道府県だけ → <b>知事</b>免許。免許は<b>全国で有効</b>（他県で取引しても免許換えは不要）", "kind": "row", "id": "c410"}, {"sec": 30, "sub": "", "front": "事務所になるもの", "back": "本店（宅建業を営んでいなくても、<b>支店で営んでいれば</b>本店も事務所）／宅建業を営む支店／継続的に業務を行う施設で、契約権限のある使用人を置くもの", "kind": "row", "id": "c411"}, {"sec": 30, "sub": "", "front": "有効期間と更新", "back": "<b>5年</b>。更新の申請は有効期間満了の <b>90日前から30日前</b>まで。<b>業務停止期間中でも更新は受けられる</b>", "kind": "row", "id": "c412"}, {"sec": 30, "sub": "", "front": "変更の届出（30日以内）", "back": "商号・名称／事務所の名称・所在地／役員・政令で定める使用人の氏名／<b>専任</b>の宅建士の氏名。<b>兼業の種類</b>や宅建士の<b>住所</b>の変更は届出不要", "kind": "row", "id": "c413"}, {"sec": 30, "sub": "", "front": "信託会社", "back": "免許は不要で、国土交通大臣に<b>届出</b>をすれば宅建業ができる。免許がないので<b>免許取消しの処分もない</b>", "kind": "row", "id": "c414"}, {"sec": 30, "sub": "", "front": "廃業等の届出", "back": "死亡は相続人が<b>知った日から</b>、それ以外（合併・破産・解散・廃業）は<b>その日から</b> <b>30日以内</b>", "kind": "row", "id": "c415"}, {"sec": 31, "sub": "", "front": "本来業務は <span class=\"gap\">①</span>。民間金融機関の <span class=\"gap\">②</span>、MBSを発行して資金を調達する（買取型）。保険を付す保証型もある。", "back": "本来業務は <mark>証券化支援</mark>。民間金融機関の <mark>住宅ローン債権を買い取り</mark>、MBSを発行して資金を調達する（買取型）。保険を付す保証型もある。", "kind": "cloze", "id": "c416"}, {"sec": 31, "sub": "", "front": "買取りの対象は <span class=\"gap\">①</span> の建設・購入資金。<span class=\"gap\">②</span>。", "back": "買取りの対象は <mark>自ら居住する住宅または親族が居住する住宅</mark> の建設・購入資金。<mark>中古住宅の購入資金も対象</mark>。", "kind": "cloze", "id": "c417"}, {"sec": 31, "sub": "", "front": "<span class=\"gap\">①</span> と <span class=\"gap\">②</span> は買取りの対象外。", "back": "<mark>賃貸住宅の建設・購入資金</mark> と <mark>リフォーム資金</mark> は買取りの対象外。", "kind": "cloze", "id": "c418"}, {"sec": 31, "sub": "", "front": "直接融資ができるのは、災害復興建築物／災害予防・地すべり防止／マンションの <span class=\"gap\">①</span>／<span class=\"gap\">②</span> の住宅改良（バリアフリー・耐震）／子どもを育成する家庭向けの賃貸住宅／合理的土地利用建築物の建設・購入。", "back": "直接融資ができるのは、災害復興建築物／災害予防・地すべり防止／マンションの <mark>共用部分の改良</mark>／<mark>高齢者向け</mark> の住宅改良（バリアフリー・耐震）／子どもを育成する家庭向けの賃貸住宅／合理的土地利用建築物の建設・購入。", "kind": "cloze", "id": "c419"}, {"sec": 31, "sub": "", "front": "★ 機構がマンション向けに<b>直接</b>貸し付けられるもの：<span class=\"gap\">①</span><br>および <span class=\"gap\">②</span>。", "back": "★ 機構がマンション向けに<b>直接</b>貸し付けられるもの：<mark>マンションの建物更新等に必要な資金</mark><br>および <mark>要除却等認定マンションの除却等に必要な資金</mark>。", "kind": "cloze", "id": "c420"}, {"sec": 31, "sub": "", "front": "団体信用生命保険では、機構が <span class=\"gap\">①</span> となり、死亡・重度障害の場合に残債に充当する業務を行う。", "back": "団体信用生命保険では、機構が <mark>自ら保険契約者</mark> となり、死亡・重度障害の場合に残債に充当する業務を行う。", "kind": "cloze", "id": "c421"}, {"sec": 32, "sub": "", "front": "徒歩の所要時間は、道路距離 <span class=\"gap\">①</span> につき1分。1分未満の端数は <span class=\"gap\">②</span>。", "back": "徒歩の所要時間は、道路距離 <mark>80m</mark> につき1分。1分未満の端数は <mark>切り上げる</mark>。", "kind": "cloze", "id": "c422"}, {"sec": 32, "sub": "", "front": "「新築」と表示できるのは、建築工事完了後 <span class=\"gap\">①</span> で、<span class=\"gap\">②</span> もの。", "back": "「新築」と表示できるのは、建築工事完了後 <mark>1年未満</mark> で、<mark>居住の用に供されたことがない</mark> もの。", "kind": "cloze", "id": "c423"}, {"sec": 32, "sub": "", "front": "過去の販売価格との二重価格表示：比較に使えるのは値下げ <span class=\"gap\">①</span> の価格で、値下げ前 <span class=\"gap\">②</span> 公表していたもの。値下げの日から <span class=\"gap\">③</span> に表示する。賃料の二重価格表示は <span class=\"gap\">④</span>。", "back": "過去の販売価格との二重価格表示：比較に使えるのは値下げ <mark>直前</mark> の価格で、値下げ前 <mark>2か月以上</mark> 公表していたもの。値下げの日から <mark>6か月以内</mark> に表示する。賃料の二重価格表示は <mark>できない</mark>。", "kind": "cloze", "id": "c424"}, {"sec": 32, "sub": "", "front": "おとり広告：取引できない物件・取引する意思のない物件の表示。<span class=\"gap\">①</span> を載せ続けるのも該当する。", "back": "おとり広告：取引できない物件・取引する意思のない物件の表示。<mark>成約済みの物件</mark> を載せ続けるのも該当する。", "kind": "cloze", "id": "c425"}, {"sec": 32, "sub": "", "front": "道路に <span class=\"gap\">①</span> 接していない土地は「<span class=\"gap\">②</span>」または「建築不可」と明示する。", "back": "道路に <mark>2m以上</mark> 接していない土地は「<mark>再建築不可</mark>」または「建築不可」と明示する。", "kind": "cloze", "id": "c426"}, {"sec": 32, "sub": "", "front": "新築賃貸マンション等の賃料は、全住戸の表示が困難なら<br><span class=\"gap\">①</span> だけでよい。新築分譲の価格は <span class=\"gap\">②</span> とその戸数（10戸以上のとき）。", "back": "新築賃貸マンション等の賃料は、全住戸の表示が困難なら<br><mark>最低賃料と最高賃料</mark> だけでよい。新築分譲の価格は <mark>最低・最高・最多価格帯</mark> とその戸数（10戸以上のとき）。", "kind": "cloze", "id": "c427"}, {"sec": 32, "sub": "", "front": "私道負担は <span class=\"gap\">①</span>、その旨と面積を表示する。公園などから直線距離 <span class=\"gap\">②</span> 以内なら物件名に施設名を使える。", "back": "私道負担は <mark>面積に関係なく</mark>、その旨と面積を表示する。公園などから直線距離 <mark>300m</mark> 以内なら物件名に施設名を使える。", "kind": "cloze", "id": "c428"}, {"sec": 32, "sub": "", "front": "傾斜地：おおむね <span class=\"gap\">①</span> 以上なら表示（マンション・別荘地は不要）。有効な利用が <span class=\"gap\">②</span> されるなら別荘地でも表示。", "back": "傾斜地：おおむね <mark>30%</mark> 以上なら表示（マンション・別荘地は不要）。有効な利用が <mark>著しく阻害</mark> されるなら別荘地でも表示。", "kind": "cloze", "id": "c429"}, {"sec": 33, "sub": "", "front": "台地・段丘は水はけがよく地盤も安定し、宅地に <span class=\"gap\">①</span>。自然堤防も後背湿地より <span class=\"gap\">②</span>。", "back": "台地・段丘は水はけがよく地盤も安定し、宅地に <mark>適する</mark>。自然堤防も後背湿地より <mark>適する</mark>。", "kind": "cloze", "id": "c430"}, {"sec": 33, "sub": "", "front": "旧河道・後背湿地・埋立地・干拓地などの低地は、洪水・<span class=\"gap\">①</span>・地盤沈下の危険が大きい。干拓地は埋立地より <span class=\"gap\">②</span>（海面より低いことが多い）。", "back": "旧河道・後背湿地・埋立地・干拓地などの低地は、洪水・<mark>液状化</mark>・地盤沈下の危険が大きい。干拓地は埋立地より <mark>危険</mark>（海面より低いことが多い）。", "kind": "cloze", "id": "c431"}, {"sec": 33, "sub": "", "front": "盛土と切土の <span class=\"gap\">①</span> は不同沈下が起きやすい。擁壁には <span class=\"gap\">②</span> を設ける。", "back": "盛土と切土の <mark>境目</mark> は不同沈下が起きやすい。擁壁には <mark>水抜き穴</mark> を設ける。", "kind": "cloze", "id": "c432"}, {"sec": 33, "sub": "", "front": "等高線の間隔が <span class=\"gap\">①</span> ほど急傾斜。谷では等高線が <span class=\"gap\">②</span> に食い込む。", "back": "等高線の間隔が <mark>狭い</mark> ほど急傾斜。谷では等高線が <mark>山頂側</mark> に食い込む。", "kind": "cloze", "id": "c433"}, {"sec": 33, "sub": "", "front": "鉄骨造は不燃だが <span class=\"gap\">①</span>、耐火被覆が要る。鉄筋コンクリート造は <span class=\"gap\">②</span> で鉄筋が錆びる。免震は揺れを <span class=\"gap\">③</span>、制震は揺れを <span class=\"gap\">④</span>。", "back": "鉄骨造は不燃だが <mark>耐火性が低く</mark>、耐火被覆が要る。鉄筋コンクリート造は <mark>中性化</mark> で鉄筋が錆びる。免震は揺れを <mark>建物に伝えにくくする</mark>、制震は揺れを <mark>吸収する</mark>。", "kind": "cloze", "id": "c434"}, {"sec": 34, "sub": "新設住宅着工戸数（令和7年。R8年1月公表）", "front": "総戸数（全体）（着工戸数・前年比・増減）", "back": "<span class=\"k\">着工戸数：</span>約 <b>74.1万戸</b><br><span class=\"k\">前年比：</span>−<b>6.5</b>%<br><span class=\"k\">増減：</span><b>3年連続</b>の減少", "kind": "row", "id": "c435"}, {"sec": 34, "sub": "新設住宅着工戸数（令和7年。R8年1月公表）", "front": "持家（着工戸数・前年比・増減）", "back": "<span class=\"k\">着工戸数：</span>約20.1万戸<br><span class=\"k\">前年比：</span>−7.7%<br><span class=\"k\">増減：</span><b>4年連続</b>の減少（ここだけ4年）", "kind": "row", "id": "c436"}, {"sec": 34, "sub": "新設住宅着工戸数（令和7年。R8年1月公表）", "front": "貸家（着工戸数・前年比・増減）", "back": "<span class=\"k\">着工戸数：</span>約32.5万戸<br><span class=\"k\">前年比：</span>−5.0%<br><span class=\"k\">増減：</span>3年連続の減少", "kind": "row", "id": "c437"}, {"sec": 34, "sub": "新設住宅着工戸数（令和7年。R8年1月公表）", "front": "分譲住宅（着工戸数・前年比・増減）", "back": "<span class=\"k\">着工戸数：</span>約20.8万戸<br><span class=\"k\">前年比：</span>−7.6%<br><span class=\"k\">増減：</span>3年連続の減少", "kind": "row", "id": "c438"}, {"sec": 34, "sub": "新設住宅着工戸数（令和7年。R8年1月公表）", "front": "うちマンション（着工戸数・前年比・増減）", "back": "<span class=\"k\">着工戸数：</span>約9.0万戸<br><span class=\"k\">前年比：</span>−12.2%（下げ幅が最大）<br><span class=\"k\">増減：</span>3年連続の減少", "kind": "row", "id": "c439"}, {"sec": 34, "sub": "新設住宅着工戸数（令和7年。R8年1月公表）", "front": "うち一戸建住宅（着工戸数・前年比・増減）", "back": "<span class=\"k\">着工戸数：</span>約11.6万戸<br><span class=\"k\">前年比：</span>−4.3%<br><span class=\"k\">増減：</span>3年連続の減少", "kind": "row", "id": "c440"}, {"sec": 34, "sub": "地価公示（令和8年。R8年3月公表。令和7年の1年間の変動率）", "front": "全国（全用途平均・住宅地・商業地・工業地）", "back": "<span class=\"k\">全用途平均：</span>+<b>2.8</b>%<br><span class=\"k\">住宅地：</span>+<b>2.1</b>%<br><span class=\"k\">商業地：</span>+<b>4.3</b>%<br><span class=\"k\">工業地：</span>+4.9%（<b>10年</b>連続上昇）", "kind": "row", "id": "c441"}, {"sec": 34, "sub": "地価公示（令和8年。R8年3月公表。令和7年の1年間の変動率）", "front": "三大都市圏（全用途平均・住宅地・商業地・工業地）", "back": "<span class=\"k\">全用途平均：</span>+4.6%<br><span class=\"k\">住宅地：</span>+3.5%<br><span class=\"k\">商業地：</span>+7.8%<br><span class=\"k\">工業地：</span>+6.7%（<b>12年</b>連続上昇）", "kind": "row", "id": "c442"}, {"sec": 34, "sub": "地価公示（令和8年。R8年3月公表。令和7年の1年間の変動率）", "front": "地方圏（全用途平均・住宅地・商業地・工業地）", "back": "<span class=\"k\">全用途平均：</span>+1.2%<br><span class=\"k\">住宅地：</span>+0.9%<br><span class=\"k\">商業地：</span>+1.6%<br><span class=\"k\">工業地：</span>+3.1%（<b>9年</b>連続上昇）", "kind": "row", "id": "c443"}, {"sec": 34, "sub": "法人企業統計（令和6年度。R7年9月公表）", "front": "売上高（不動産業・前年度比・全産業・前年度比）", "back": "<span class=\"k\">不動産業：</span>約58兆8,000億円<br><span class=\"k\">前年度比：</span>+4.2%<br><span class=\"k\">全産業：</span>約1,692兆4,000億円<br><span class=\"k\">前年度比：</span>+3.6%", "kind": "row", "id": "c444"}, {"sec": 34, "sub": "法人企業統計（令和6年度。R7年9月公表）", "front": "営業利益（不動産業・前年度比・全産業・前年度比）", "back": "<span class=\"k\">不動産業：</span>約7兆2,000億円<br><span class=\"k\">前年度比：</span>+12.9%<br><span class=\"k\">全産業：</span>約84兆8,000億円<br><span class=\"k\">前年度比：</span>+12.2%", "kind": "row", "id": "c445"}, {"sec": 34, "sub": "法人企業統計（令和6年度。R7年9月公表）", "front": "経常利益（不動産業・前年度比・全産業・前年度比）", "back": "<span class=\"k\">不動産業：</span>約8兆円<br><span class=\"k\">前年度比：</span>+8.7%<br><span class=\"k\">全産業：</span>約114兆7,000億円<br><span class=\"k\">前年度比：</span>+7.5%", "kind": "row", "id": "c446"}, {"sec": 34, "sub": "法人企業統計（令和6年度。R7年9月公表）", "front": "売上高営業利益率（不動産業・前年度比・全産業・前年度比）", "back": "<span class=\"k\">不動産業：</span><b>12.2%</b><br><span class=\"k\">前年度比：</span>増加<br><span class=\"k\">全産業：</span>5.0%<br><span class=\"k\">前年度比：</span>増加", "kind": "row", "id": "c447"}, {"sec": 34, "sub": "法人企業統計（令和6年度。R7年9月公表）", "front": "売上高経常利益率（不動産業・前年度比・全産業・前年度比）", "back": "<span class=\"k\">不動産業：</span><b>13.6%</b><br><span class=\"k\">前年度比：</span>増加<br><span class=\"k\">全産業：</span>6.8%<br><span class=\"k\">前年度比：</span>増加", "kind": "row", "id": "c448"}, {"sec": 34, "sub": "宅建業者数（令和6年度末＝令和7年3月末。R7年10月公表）", "front": "宅建業者数（数値・前年比・傾向）", "back": "<span class=\"k\">数値：</span>約 <b>13万</b>2,000業者<br><span class=\"k\">前年比：</span>増加<br><span class=\"k\">傾向：</span><b>11年連続</b>の増加", "kind": "row", "id": "c449"}, {"sec": 34, "sub": "宅建業者数（令和6年度末＝令和7年3月末。R7年10月公表）", "front": "宅建士登録者数（数値・前年比・傾向）", "back": "<span class=\"k\">数値：</span>約 <b>121万</b>2,000人<br><span class=\"k\">前年比：</span>増加<br><span class=\"k\">傾向：</span>新規登録者は約 <b>3万人</b>で増加傾向", "kind": "row", "id": "c450"}, {"sec": 34, "sub": "宅建業者数（令和6年度末＝令和7年3月末。R7年10月公表）", "front": "住宅・土地統計調査（令和5年）：総住宅数 <span class=\"gap\">①</span>、空き家 <span class=\"gap\">②</span>、空き家率 <span class=\"gap\">③</span>。", "back": "住宅・土地統計調査（令和5年）：総住宅数 <mark>6,504万7千戸</mark>、空き家 <mark>900万2千戸</mark>、空き家率 <mark>13.8%（過去最高）</mark>。", "kind": "cloze", "id": "c451"}]}</script>
<script>
(function(){
"use strict";
const DATA = JSON.parse(document.getElementById('data').textContent);
const SECS = DATA.sections, CARDS = DATA.cards;
const TIERS = ['A','維持','B'];
const TIER_CLASS = {'A':'A','維持':'K','B':'B'};
const TIER_W = {'A':3,'維持':1,'B':2};
const FIELDS = ['業法','権利','法令','税','免除'];
const fieldOf = n => { const f = SECS[n].field || ''; return f.indexOf('税') === 0 ? '税' : f; };
const MIN = 60e3, DAY = 864e5;
const IVL = {1: 1*MIN, 2: 10*MIN, 3: 1*DAY, 4: 3*DAY, 5: 7*DAY};
const KEY = 'sheetb-drill-v1';

// ---------- 状態 ----------
const fresh0 = () => ({cards:{}, savedAt:0, today:{date:'', n:0}, settings:{tiers:{A:true,'維持':true,B:true}, fields:{'業法':true,'権利':true,'法令':true,'税':true,'免除':true}, focus:null}});
let state = fresh0();
try { const raw = localStorage.getItem(KEY); if (raw) state = Object.assign(state, JSON.parse(raw)); } catch(e) {}
const saveLocal = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e) {} };
const todayStr = () => { const d = new Date(Date.now()); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); };

const st = id => state.cards[id] || null;
const secLast = {};
let current = null, revealed = false, lastId = null, ahead = false;

function inRange(c){
  const set = state.settings;
  if (set.focus != null) return String(c.sec) === String(set.focus);
  return !!set.tiers[SECS[c.sec].tier] && !!set.fields[fieldOf(c.sec)];
}
function pool(){ return CARDS.filter(inRange); }

// ---------- 次のカード（項目を順番に回し、同じ項目が続かないようにする） ----------
function pickNext(){
  const now = Date.now(), P = pool();
  if (!P.length) return {card:null, why:'none'};
  const due = P.filter(c => { const s = st(c.id); return s && s.b > 0 && s.d <= now && c.id !== lastId; });
  if (due.length){
    const bySec = {};
    due.forEach(c => (bySec[c.sec] = bySec[c.sec] || []).push(c));
    const secs = Object.keys(bySec).sort((a,b) => (secLast[a]||0) - (secLast[b]||0));
    return {card:bySec[secs[0]].sort((a,b) => st(a.id).d - st(b.id).d)[0], why:'due'};
  }
  const fresh = P.filter(c => { const s = st(c.id); return (!s || s.b === 0) && c.id !== lastId; });
  if (fresh.length){
    const bySec = {};
    fresh.forEach(c => (bySec[c.sec] = bySec[c.sec] || []).push(c));
    let best = null, bestScore = -1;
    Object.keys(bySec).forEach(k => {
      const score = (now - (secLast[k] || 0) + 1) * TIER_W[SECS[k].tier] * (0.9 + Math.random()*0.2);
      if (score > bestScore){ bestScore = score; best = k; }
    });
    return {card:bySec[best][0], why:'new'};
  }
  if (!ahead) return {card:null, why:'done'};
  const rest = P.filter(c => c.id !== lastId).sort((a,b) => (st(a.id)?st(a.id).d:0) - (st(b.id)?st(b.id).d:0));
  return {card:rest[0] || P[0], why:'ahead'};
}
function dueCount(){ const now = Date.now(); return pool().filter(c => { const s = st(c.id); return s && s.b > 0 && s.d <= now; }).length; }
function newCount(){ return pool().filter(c => { const s = st(c.id); return !s || s.b === 0; }).length; }

// ---------- 表示 ----------
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));

function renderCount(){
  $('count').innerHTML = '今日 <b>' + state.today.n + '</b>枚　期限 <b>' + dueCount() + '</b>　未着手 <b>' + newCount() + '</b>';
  const f = state.settings.focus;
  $('focusbar').classList.toggle('on', f != null);
  if (f != null && SECS[f]) $('focusname').textContent = SECS[f].title + ' だけを解いています';
}

function render(){
  if (state.today.date !== todayStr()) state.today = {date: todayStr(), n: 0};
  if (state.settings.focus != null && !SECS[state.settings.focus]) state.settings.focus = null;
  renderCount();
  const card = $('card'), act = $('actions');
  if (!current){
    const r = pickNext();
    current = r.card;
    if (!current){
      if (r.why === 'none'){
        card.innerHTML = '<div class="empty"><strong>この範囲にカードがありません</strong>「範囲」で優先度か分野を選んでください。</div>';
        act.innerHTML = '<button class="big" type="button" id="goRange">範囲を開く</button>';
        $('goRange').onclick = () => openDlg('dlgRange');
      } else {
        const next = nextDueIn();
        card.innerHTML = '<div class="empty"><strong>今日の分は終わりました</strong>' + (next ? '次の復習は ' + next + ' 後です。' : '') + '先取りで続けることもできます。</div>';
        act.innerHTML = '<button class="big" type="button" id="goAhead">先取りで続ける</button>';
        $('goAhead').onclick = () => { ahead = true; current = null; render(); };
      }
      return;
    }
    revealed = false;
  }
  const c = current, sec = SECS[c.sec];
  let h = '<div class="where"><span class="tier ' + TIER_CLASS[sec.tier] + '">' + esc(sec.tier) + '</span><span>' + c.sec + '. ' + sec.title + (c.sub ? '<span class="sub">　' + c.sub + '</span>' : '') + '</span></div>';
  if (c.kind === 'row') h += '<p class="label">' + c.front + '</p>';
  h += '<div class="answer-wrap' + (revealed ? '' : ' covered') + '" id="sheet"' + (revealed ? '' : ' role="button" aria-label="赤シートをめくる"') + '>' +
       '<div class="answer ' + (c.kind === 'row' ? 'row' : 'cloze') + '"' + (revealed ? '' : ' aria-hidden="true"') + '>' + c.back + '</div></div>';
  card.innerHTML = h;
  if (!revealed){
    $('sheet').onclick = reveal;
    act.innerHTML = '<button class="big lift" type="button" id="btnLift">めくる</button>';
    $('btnLift').onclick = reveal;
  } else {
    act.innerHTML =
      '<button class="big x" type="button" data-g="x"><span class="sym">✕</span>出てこない</button>' +
      '<button class="big t" type="button" data-g="t"><span class="sym">△</span>あやしい</button>' +
      '<button class="big o" type="button" data-g="o"><span class="sym">○</span>言えた</button>';
    act.querySelectorAll('[data-g]').forEach(b => b.onclick = () => grade(b.dataset.g));
  }
}

function nextDueIn(){
  const now = Date.now();
  const ds = pool().map(c => st(c.id)).filter(s => s && s.b > 0 && s.d > now).map(s => s.d);
  if (!ds.length) return '';
  const ms = Math.min.apply(null, ds) - now;
  if (ms < 60*MIN) return Math.max(1, Math.round(ms/MIN)) + '分';
  if (ms < DAY) return Math.round(ms/(60*MIN)) + '時間';
  return Math.round(ms/DAY) + '日';
}

function reveal(){
  if (!current || revealed) return;
  revealed = true;
  const w = $('sheet');
  if (w){ w.classList.remove('covered'); w.removeAttribute('role'); w.onclick = null; const a = w.firstChild; if (a) a.removeAttribute('aria-hidden'); }
  const act = $('actions');
  act.innerHTML =
    '<button class="big x" type="button" data-g="x"><span class="sym">✕</span>出てこない</button>' +
    '<button class="big t" type="button" data-g="t"><span class="sym">△</span>あやしい</button>' +
    '<button class="big o" type="button" data-g="o"><span class="sym">○</span>言えた</button>';
  act.querySelectorAll('[data-g]').forEach(b => b.onclick = () => grade(b.dataset.g));
}

function grade(g){
  if (!current || !revealed) return;
  const now = Date.now(), id = current.id;
  const s = Object.assign({b:0, d:0, n:0, w:0}, st(id));
  if (g === 'x'){ s.b = 1; s.w += 1; }
  else if (g === 't'){ s.b = s.b === 0 ? 2 : Math.max(1, Math.min(s.b, 2)); }
  else { s.b = s.b === 0 ? 3 : Math.min(5, s.b + 1); }
  s.d = now + IVL[s.b]; s.n += 1;
  state.cards[id] = s;
  if (state.today.date !== todayStr()) state.today = {date: todayStr(), n: 0};
  state.today.n += 1;
  state.savedAt = now;
  secLast[current.sec] = now;
  lastId = id; current = null;
  saveLocal(); if (typeof scheduleSync === 'function') scheduleSync();
  render();
}

// ---------- 範囲 ----------
function buildRange(){
  const ct = $('chipTier'), cf = $('chipField');
  ct.innerHTML = TIERS.map(t => '<button type="button" class="chip" data-t="' + t + '" aria-pressed="' + !!state.settings.tiers[t] + '">' + (t === '維持' ? '維持' : '優先' + t) + '</button>').join('');
  cf.innerHTML = FIELDS.map(f => '<button type="button" class="chip" data-f="' + f + '" aria-pressed="' + !!state.settings.fields[f] + '">' + f + '</button>').join('');
  ct.querySelectorAll('[data-t]').forEach(b => b.onclick = () => { const t = b.dataset.t; state.settings.tiers[t] = !state.settings.tiers[t]; b.setAttribute('aria-pressed', state.settings.tiers[t]); changedRange(); });
  cf.querySelectorAll('[data-f]').forEach(b => b.onclick = () => { const f = b.dataset.f; state.settings.fields[f] = !state.settings.fields[f]; b.setAttribute('aria-pressed', state.settings.fields[f]); changedRange(); });
}
function changedRange(){ state.settings.focus = null; saveLocal(); if (current && !inRange(current)) current = null; ahead = false; render(); }

// ---------- 進み具合 ----------
function buildProg(){
  const ids = Object.keys(SECS).sort((a,b) => a - b);
  let h = '', lastTier = null;
  ids.forEach(k => {
    const sec = SECS[k];
    if (sec.tier !== lastTier){ h += '<li class="tierhead" style="border:none">' + (sec.tier === '維持' ? '維持' : '優先' + sec.tier) + '</li>'; lastTier = sec.tier; }
    const cs = CARDS.filter(c => String(c.sec) === k);
    const done = cs.filter(c => { const s = st(c.id); return s && s.b >= 3; }).length;
    const pct = cs.length ? Math.round(done * 100 / cs.length) : 0;
    h += '<li><button type="button" data-s="' + k + '"><span class="tier ' + TIER_CLASS[sec.tier] + '">' + k + '</span><span class="nm">' + sec.title + '</span><span class="num">' + done + '/' + cs.length + '</span><span class="bar"><i style="width:' + pct + '%"></i></span></button></li>';
  });
  $('plist').innerHTML = h;
  $('plist').querySelectorAll('[data-s]').forEach(b => b.onclick = () => { state.settings.focus = b.dataset.s; saveLocal(); current = null; ahead = false; closeDlg('dlgProg'); render(); });
}

function openDlg(id){ if (id === 'dlgRange') buildRange(); if (id === 'dlgProg') buildProg(); const d = $(id); if (d.showModal) d.showModal(); else d.setAttribute('open',''); }
function closeDlg(id){ const d = $(id); if (d.close) d.close(); else d.removeAttribute('open'); }
document.querySelectorAll('dialog [data-close]').forEach(b => b.onclick = () => closeDlg(b.closest('dialog').id));
document.querySelectorAll('dialog').forEach(d => d.addEventListener('click', e => { if (e.target === d) closeDlg(d.id); }));
$('btnRange').onclick = () => openDlg('dlgRange');
$('btnProg').onclick = () => openDlg('dlgProg');
$('btnUnfocus').onclick = () => { state.settings.focus = null; saveLocal(); current = null; render(); };

document.addEventListener('keydown', e => {
  if (document.querySelector('dialog[open]')) return;
  if (e.key === ' ' || e.key === 'Enter'){ if (!revealed){ e.preventDefault(); reveal(); } }
  else if (revealed && (e.key === '1' || e.key === 'j')) grade('x');
  else if (revealed && (e.key === '2' || e.key === 'k')) grade('t');
  else if (revealed && (e.key === '3' || e.key === 'l')) grade('o');
});


// ---------- オフライン版：記録の書き出し・読み込み、オフライン用の登録 ----------
$('btnExport').onclick = () => {
  const d = new Date(Date.now());
  const name = 'sheetB-drill-' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0') + '.json';
  const blob = new Blob([JSON.stringify({app:'sheetb-drill', v:1, state:state})], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  $('backupNote').textContent = name + ' を書き出しました。';
};
$('fileImport').onchange = e => {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const obj = JSON.parse(r.result);
      if (!obj || obj.app !== 'sheetb-drill' || !obj.state || !obj.state.cards) throw new Error('bad');
      state = Object.assign(fresh0(), obj.state);
      saveLocal(); current = null; closeDlg('dlgProg'); render();
    } catch(err){ $('backupNote').textContent = 'このファイルは読み込めません。「記録を書き出す」で作ったファイルを選んでください。'; }
  };
  r.readAsText(f);
  e.target.value = '';
};
if (navigator.storage && navigator.storage.persist) { navigator.storage.persist().catch(() => {}); }
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => { navigator.serviceWorker.register('./sw.js').catch(() => {}); });
}




render();
})();
</script>
