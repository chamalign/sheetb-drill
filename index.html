<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>シートB ドリル</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="シートB">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#E6E9ED">

<style>
:root{
  --desk:#E6E9ED; --chrome:#17202C; --chrome-soft:#5B6674; --rule:#C9D0D8;
  --paper:#FCFCFA; --card-ink:#17202C; --card-soft:#606B79;
  --shu:#FF5A36; --sheet:#C8101E; --through:#2B0306; --focus:#2563EB;
  --btn:#FCFCFA; --btn-ink:#17202C; --btn-edge:#C9D0D8;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP","Yu Gothic UI","Yu Gothic","Meiryo",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --desk:#1C2431; --chrome:#E4E8EE; --chrome-soft:#9CA7B6; --rule:#324054;
    --btn:#26314A; --btn-ink:#E4E8EE; --btn-edge:#3A4861;
  }
}
:root[data-theme="dark"]{
  --desk:#1C2431; --chrome:#E4E8EE; --chrome-soft:#9CA7B6; --rule:#324054;
  --btn:#26314A; --btn-ink:#E4E8EE; --btn-edge:#3A4861;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--desk);color:var(--chrome);-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}

.wrap{max-width:640px;margin:0 auto;padding:0 16px 132px}
header.top{display:flex;align-items:center;gap:10px;padding:14px 0 10px;flex-wrap:wrap}
.brand{font-weight:700;font-size:17px}
.count{font-size:14px;color:var(--chrome-soft);margin-right:auto;font-variant-numeric:tabular-nums}
.count b{color:var(--chrome);font-weight:700}
.tbtn{background:none;border:1px solid var(--rule);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.focusbar{display:none;align-items:center;gap:10px;margin:0 0 10px;font-size:14px;color:var(--chrome-soft)}
.focusbar.on{display:flex}
.focusbar button{background:none;border:none;color:var(--focus);padding:4px 0;cursor:pointer;font-size:14px}

/* ---- カード（紙） ---- */
.card{background:var(--paper);color:var(--card-ink);border:1px solid rgba(23,32,44,.10);border-radius:6px;
  box-shadow:0 1px 0 rgba(23,32,44,.06),0 14px 30px -18px rgba(23,32,44,.45);padding:18px 18px 22px;min-height:260px}
.where{display:flex;align-items:baseline;gap:10px;font-size:13px;color:var(--card-soft);margin-bottom:14px}
.tier{display:inline-block;min-width:1.9em;text-align:center;border-radius:3px;padding:1px 5px;font-weight:700;font-size:12px;color:#fff}
.tier.A{background:#17202C}.tier.K{background:#7A8594}.tier.B{background:#A3ACB8;color:#17202C}
.sub{color:var(--card-soft)}
.label{font-size:18px;line-height:1.7;font-weight:700;margin:0 0 14px}
.answer-wrap{position:relative;padding:8px 10px;margin:0 -10px;border-radius:4px;
  transition:background-color .22s ease}
.answer{font-size:18px;line-height:1.85;word-break:break-word}
.answer.row{color:var(--shu)}
.answer .k{color:var(--card-ink);font-weight:700}
.answer.cloze{color:var(--card-ink)}
mark{background:none;color:var(--shu);font-weight:700}
.answer,.answer .k,mark{transition:color .22s ease}

/* 赤シートをかぶせた状態。答え（朱）は文字色を透明にするので、目をこらしても読めない。
   黒い文字だけが赤越しに透けて見える。 */
.answer-wrap.covered{background:var(--sheet);cursor:pointer;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.22),inset 0 10px 18px -12px rgba(255,255,255,.35)}
.answer-wrap.covered .answer.cloze,
.answer-wrap.covered .answer .k{color:var(--through)}
.answer-wrap.covered .answer.row,
.answer-wrap.covered mark{color:transparent;-webkit-text-fill-color:transparent;text-shadow:none}
.answer-wrap.covered .answer.row .k{-webkit-text-fill-color:var(--through)}
.answer-wrap.covered,.answer-wrap.covered *{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
@media (prefers-reduced-motion: reduce){.answer-wrap,.answer,.answer .k,mark{transition:none}}

/* ---- 下の操作 ---- */
.actions{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(to top,var(--desk) 70%,transparent)}
.actions .in{max-width:640px;margin:0 auto;display:flex;gap:10px}
.big{flex:1;min-height:56px;border-radius:10px;border:1px solid var(--btn-edge);background:var(--btn);color:var(--btn-ink);
  font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px}
.big .sym{font-size:22px;line-height:1}
.big.lift{background:var(--chrome);color:var(--desk);border-color:var(--chrome)}
.big.x .sym{color:#E0362B}.big.t .sym{color:#C98A00}.big.o .sym{color:#1F8A4C}

.empty{font-size:16px;line-height:1.8;color:var(--card-soft)}
.empty strong{display:block;color:var(--card-ink);font-size:18px;margin-bottom:6px}

/* ---- 引き出し（範囲・進み具合） ---- */
dialog{border:none;border-radius:14px 14px 0 0;padding:0;width:100%;max-width:640px;margin:auto auto 0;max-height:86vh;
  background:var(--paper);color:var(--card-ink)}
dialog::backdrop{background:rgba(10,15,25,.45)}
.dh{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 8px}
.dh h2{margin:0;font-size:17px}
.dh button{background:none;border:none;font-size:15px;color:var(--focus);cursor:pointer;padding:6px}
.db{padding:4px 18px calc(22px + env(safe-area-inset-bottom,0px));overflow:auto;max-height:calc(86vh - 56px)}
.group{margin:12px 0 18px}
.group h3{font-size:13px;color:var(--card-soft);margin:0 0 8px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid #C9D0D8;background:#fff;color:#17202C;border-radius:999px;padding:8px 14px;font-size:15px;cursor:pointer}
.chip[aria-pressed="true"]{background:#17202C;color:#fff;border-color:#17202C}
.plist{list-style:none;margin:0;padding:0}
.plist li{border-top:1px solid #E3E7EC}
.plist button{width:100%;background:none;border:none;text-align:left;padding:10px 2px;cursor:pointer;display:grid;
  grid-template-columns:2.2em 1fr auto;gap:10px;align-items:center;color:#17202C}
.plist .nm{font-size:15px}
.plist .num{font-size:13px;color:#606B79;font-variant-numeric:tabular-nums}
.bar{grid-column:2 / 4;height:5px;background:#E3E7EC;border-radius:3px;overflow:hidden;margin-top:-4px}
.bar i{display:block;height:100%;background:#17202C}
.tierhead{font-size:13px;color:#606B79;margin:16px 0 4px;font-weight:700}
.backup{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 4px;padding-top:14px;border-top:1px solid #E3E7EC}
.backup button,.backup label{border:1px solid #C9D0D8;background:#fff;color:#17202C;border-radius:8px;padding:9px 14px;font-size:14px;cursor:pointer}
.backup input{display:none}
.note{font-size:13px;color:#606B79;margin:8px 0 0}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="brand">シートB</span>
    <span class="count" id="count"></span>
    <button class="tbtn" id="btnRange" type="button">範囲</button>
    <button class="tbtn" id="btnProg" type="button">進み具合</button>
  </header>
  <div class="focusbar" id="focusbar"><span id="focusname"></span><button type="button" id="btnUnfocus">全範囲に戻す</button></div>
  <main class="card" id="card" aria-live="polite"></main>
</div>

<div class="actions"><div class="in" id="actions"></div></div>

<dialog id="dlgRange" aria-labelledby="hRange">
  <div class="dh"><h2 id="hRange">解く範囲</h2><button type="button" data-close>閉じる</button></div>
  <div class="db">
    <div class="group"><h3>優先度</h3><div class="chips" id="chipTier"></div></div>
    <div class="group"><h3>分野</h3><div class="chips" id="chipField"></div></div>
  </div>
</dialog>

<dialog id="dlgProg" aria-labelledby="hProg">
  <div class="dh"><h2 id="hProg">進み具合</h2><button type="button" data-close>閉じる</button></div>
  <div class="db">
    <ul class="plist" id="plist"></ul>
    
    <div class="backup">
      <button type="button" id="btnExport">記録を書き出す</button>
      <label>記録を読み込む<input type="file" id="fileImport" accept="application/json,.json"></label>
    </div>
    <p class="note" id="backupNote">記録はこの端末の中に保存されています。機種変更の前などに書き出してください。</p>
    
  </div>
</dialog>

ld": "免除", "tier": "B"}, "33": {"title": "土地・建物", "field": "免除", "tier": "B"}, "34": {"title": "統計", "field": "免除", "tier": "B"}}, "cards": [{"sec": 1, "sub": "", "front": "存続期間（借地権（土地）・借家権（建物））", "back": "<span class=\"k\">借地権（土地）：</span><b>30年以上</b>→更新<b>20年以上</b>→<b>10年以上</b><br><span class=\"k\">借家権（建物）：</span><b>上限なし</b>（民法604条の50年上限は29条2項で適用除外）", "kind": "row", "id": "c001"}, {"sec": 1, "sub": "", "front": "対抗要件（借地権（土地）・借家権（建物））", "back": "<span class=\"k\">借地権（土地）：</span>借地権者名義の<b>建物登記</b>（土地の賃借権登記は不要）<br><span class=\"k\">借家権（建物）：</span>建物の<b>引渡し</b>（登記は不要）", "kind": "row", "id": "c002"}, {"sec": 1, "sub": "", "front": "更新・解約（借地権（土地）・借家権（建物））", "back": "<span class=\"k\">借地権（土地）：</span>建物がある限り<b>法定更新</b>。設定者の<b>遅滞ない異議</b>＋<b>正当事由</b>で拒める<br><span class=\"k\">借家権（建物）：</span>賃借人が使用継続し賃貸人が異議を述べなければ<b>法定更新</b>。解約・拒絶には<b>正当事由</b>が必要", "kind": "row", "id": "c003"}, {"sec": 1, "sub": "", "front": "存続期間（一般定期借地権(22条)・事業用定期借地権等(23条)・建物譲渡特約付(24条)）", "back": "<span class=\"k\">一般定期借地権(22条)：</span><b>50年以上</b><br><span class=\"k\">事業用定期借地権等(23条)：</span><b>10年以上50年未満</b><br><span class=\"k\">建物譲渡特約付(24条)：</span><b>30年以上</b>経過時に建物譲渡", "kind": "row", "id": "c004"}, {"sec": 1, "sub": "", "front": "用途（一般定期借地権(22条)・事業用定期借地権等(23条)・建物譲渡特約付(24条)）", "back": "<span class=\"k\">一般定期借地権(22条)：</span>制限なし（居住用も可）<br><span class=\"k\">事業用定期借地権等(23条)：</span>もっぱら<b>事業用</b>（居住用は<b>不可</b>）<br><span class=\"k\">建物譲渡特約付(24条)：</span>制限なし", "kind": "row", "id": "c005"}, {"sec": 1, "sub": "", "front": "★ 契約方式（一般定期借地権(22条)・事業用定期借地権等(23条)・建物譲渡特約付(24条)）", "back": "<span class=\"k\">一般定期借地権(22条)：</span>書面<b>または電磁的記録</b><br><span class=\"k\">事業用定期借地権等(23条)：</span><b>公正証書に限る</b>（電磁的記録は不可）<br><span class=\"k\">建物譲渡特約付(24条)：</span>制限なし", "kind": "row", "id": "c006"}, {"sec": 1, "sub": "借地：建物の譲渡・滅失・再築・買取請求（主語に注意して読む）", "front": "19条：<b>借地権者</b>が借地上の建物を第三者に譲渡しようとして、<b>借地権設定者（地主）</b>が賃借権の譲渡・転貸を承諾しないとき、<span class=\"gap\">①</span> は <span class=\"gap\">②</span> に、承諾に代わる <span class=\"gap\">③</span> を申し立てることができる（譲り受ける第三者が申し立てるのではない）。", "back": "19条：<b>借地権者</b>が借地上の建物を第三者に譲渡しようとして、<b>借地権設定者（地主）</b>が賃借権の譲渡・転貸を承諾しないとき、<mark>借地権者</mark> は <mark>裁判所</mark> に、承諾に代わる <mark>許可</mark> を申し立てることができる（譲り受ける第三者が申し立てるのではない）。", "kind": "cloze", "id": "c007"}, {"sec": 1, "sub": "借地：建物の譲渡・滅失・再築・買取請求（主語に注意して読む）", "front": "20条：<b>競売・公売</b>で借地上の建物を取得した<b>第三者（買受人）</b>が地主の承諾を得られないときは、<span class=\"gap\">①</span> 自身が裁判所に承諾に代わる許可を申し立てる。期限は <span class=\"gap\">②</span> <span class=\"gap\">③</span>（「取得を知った日から」ではない）。", "back": "20条：<b>競売・公売</b>で借地上の建物を取得した<b>第三者（買受人）</b>が地主の承諾を得られないときは、<mark>その第三者（買受人）</mark> 自身が裁判所に承諾に代わる許可を申し立てる。期限は <mark>建物の代金を支払った後</mark> <mark>2か月以内</mark>（「取得を知った日から」ではない）。", "kind": "cloze", "id": "c008"}, {"sec": 1, "sub": "借地：建物の譲渡・滅失・再築・買取請求（主語に注意して読む）", "front": "10条2項 建物の滅失：借地上の建物が滅失しても、<b>借地権者</b>が土地の見やすい場所に <span class=\"gap\">①</span>・<span class=\"gap\">②</span>・<span class=\"gap\">③</span> を掲示すれば、滅失の日から <span class=\"gap\">④</span> は第三者に対抗できる。2年以内に <span class=\"gap\">⑤</span> して <span class=\"gap\">⑥</span> をしないと、2年経過後は対抗できない。", "back": "10条2項 建物の滅失：借地上の建物が滅失しても、<b>借地権者</b>が土地の見やすい場所に <mark>建物を特定する事項</mark>・<mark>滅失の日</mark>・<mark>再築する旨</mark> を掲示すれば、滅失の日から <mark>2年間</mark> は第三者に対抗できる。2年以内に <mark>再築</mark> して <mark>建物の登記</mark> をしないと、2年経過後は対抗できない。", "kind": "cloze", "id": "c009"}, {"sec": 1, "sub": "借地：建物の譲渡・滅失・再築・買取請求（主語に注意して読む）", "front": "対抗要件になる建物登記は <span class=\"gap\">①</span> の名義に限る。配偶者や長男など <span class=\"gap\">②</span> では対抗できない（判例）。", "back": "対抗要件になる建物登記は <mark>借地権者本人</mark> の名義に限る。配偶者や長男など <mark>家族名義</mark> では対抗できない（判例）。", "kind": "cloze", "id": "c010"}, {"sec": 1, "sub": "借地：建物の譲渡・滅失・再築・買取請求（主語に注意して読む）", "front": "7条 当初の期間中の再築：建物が滅失し、<b>借地権者</b>が <span class=\"gap\">①</span> を得て残存期間を超える建物を再築すると、借地権は <span class=\"gap\">②</span> か <span class=\"gap\">③</span> の早い方から <span class=\"gap\">④</span> 存続する。承諾がなければ <span class=\"gap\">⑤</span>。", "back": "7条 当初の期間中の再築：建物が滅失し、<b>借地権者</b>が <mark>借地権設定者の承諾</mark> を得て残存期間を超える建物を再築すると、借地権は <mark>承諾の日</mark> か <mark>築造の日</mark> の早い方から <mark>20年</mark> 存続する。承諾がなければ <mark>延長しない</mark>。", "kind": "cloze", "id": "c011"}, {"sec": 1, "sub": "借地：建物の譲渡・滅失・再築・買取請求（主語に注意して読む）", "front": "8条 更新後の再築：更新後の期間中に、借地権者が <span class=\"gap\">①</span> なしに残存期間を超える建物を再築すると、<span class=\"gap\">②</span> のほうから地上権の消滅請求・土地賃貸借の解約の申入れができる。", "back": "8条 更新後の再築：更新後の期間中に、借地権者が <mark>借地権設定者の承諾</mark> なしに残存期間を超える建物を再築すると、<mark>借地権設定者</mark> のほうから地上権の消滅請求・土地賃貸借の解約の申入れができる。", "kind": "cloze", "id": "c012"}, {"sec": 1, "sub": "借地：建物の譲渡・滅失・再築・買取請求（主語に注意して読む）", "front": "13条 建物買取請求権：期間満了で <span class=\"gap\">①</span> とき、<b>借地権者</b>は<b>借地権設定者</b>に対し、建物を <span class=\"gap\">②</span> で買い取るよう請求できる。<span class=\"gap\">③</span> で終わったときは請求できない（判例）。請求した借地権者は代金の支払いまで建物と敷地の <span class=\"gap\">④</span> が、敷地の <span class=\"gap\">⑤</span> は支払う（判例）。", "back": "13条 建物買取請求権：期間満了で <mark>更新がない</mark> とき、<b>借地権者</b>は<b>借地権設定者</b>に対し、建物を <mark>時価</mark> で買い取るよう請求できる。<mark>債務不履行による解除</mark> で終わったときは請求できない（判例）。請求した借地権者は代金の支払いまで建物と敷地の <mark>引渡しを拒める</mark> が、敷地の <mark>賃料相当額</mark> は支払う（判例）。", "kind": "cloze", "id": "c013"}, {"sec": 1, "sub": "借地：建物の譲渡・滅失・再築・買取請求（主語に注意して読む）", "front": "<span class=\"gap\">①</span> も建物買取請求権を持つ。AB間・AC間の契約がともに期間満了で終わったとき、転借人Cは地主Bに <span class=\"gap\">②</span> 請求できる。", "back": "<mark>転借地権者</mark> も建物買取請求権を持つ。AB間・AC間の契約がともに期間満了で終わったとき、転借人Cは地主Bに <mark>直接</mark> 請求できる。", "kind": "cloze", "id": "c014"}, {"sec": 1, "sub": "借家：期間・更新・終了", "front": "29条：借家で期間を <span class=\"gap\">①</span> と定めると、<span class=\"gap\">②</span> 建物賃貸借とみなされる（定期建物賃貸借を除く）。", "back": "29条：借家で期間を <mark>1年未満</mark> と定めると、<mark>期間の定めがない</mark> 建物賃貸借とみなされる（定期建物賃貸借を除く）。", "kind": "cloze", "id": "c015"}, {"sec": 1, "sub": "借家：期間・更新・終了", "front": "26条・28条：期間の定めがある借家で、<b>賃貸人・賃借人のどちらか</b>が更新を拒むには、期間満了の <span class=\"gap\">①</span> から <span class=\"gap\">②</span> までに相手方に通知する。<span class=\"gap\">③</span> からの通知には <span class=\"gap\">④</span> が要る（賃借人からは不要）。通知がなければ従前と同じ条件で更新され、期間は <span class=\"gap\">⑤</span> になる。", "back": "26条・28条：期間の定めがある借家で、<b>賃貸人・賃借人のどちらか</b>が更新を拒むには、期間満了の <mark>1年前</mark> から <mark>6か月前</mark> までに相手方に通知する。<mark>賃貸人</mark> からの通知には <mark>正当事由</mark> が要る（賃借人からは不要）。通知がなければ従前と同じ条件で更新され、期間は <mark>定めがないもの</mark> になる。", "kind": "cloze", "id": "c016"}, {"sec": 1, "sub": "借家：期間・更新・終了", "front": "27条：期間の定めがない借家で <span class=\"gap\">①</span> が解約を申し入れると <span class=\"gap\">②</span> で終わる（正当事由が要る）。<span class=\"gap\">③</span> からの申入れなら <span class=\"gap\">④</span>（民法）。「貸主の申入れから3か月で終わる」という特約は借主に不利なので <span class=\"gap\">⑤</span>。", "back": "27条：期間の定めがない借家で <mark>賃貸人</mark> が解約を申し入れると <mark>6か月</mark> で終わる（正当事由が要る）。<mark>賃借人</mark> からの申入れなら <mark>3か月</mark>（民法）。「貸主の申入れから3か月で終わる」という特約は借主に不利なので <mark>無効</mark>。", "kind": "cloze", "id": "c017"}, {"sec": 1, "sub": "借家：期間・更新・終了", "front": "民法612条：無断転貸・無断譲渡があっても、<span class=\"gap\">①</span> と認めるに足りない特段の事情があれば <span class=\"gap\">②</span>（判例）。「事情のいかんにかかわらず解除できる」は誤り。", "back": "民法612条：無断転貸・無断譲渡があっても、<mark>背信的行為</mark> と認めるに足りない特段の事情があれば <mark>解除できない</mark>（判例）。「事情のいかんにかかわらず解除できる」は誤り。", "kind": "cloze", "id": "c018"}, {"sec": 1, "sub": "借家：期間・更新・終了", "front": "32条 借賃の増減額請求：賃料が不相当になれば、<b>賃貸人・賃借人のどちらからでも</b> <span class=\"gap\">①</span> 請求できる（一定期間の経過は <span class=\"gap\">②</span>）。", "back": "32条 借賃の増減額請求：賃料が不相当になれば、<b>賃貸人・賃借人のどちらからでも</b> <mark>いつでも</mark> 請求できる（一定期間の経過は <mark>要らない</mark>）。", "kind": "cloze", "id": "c019"}, {"sec": 1, "sub": "借家：期間・更新・終了", "front": "賃料の特約：借地（11条）も普通借家（32条）も、「<span class=\"gap\">①</span>」特約だけ有効で、「<span class=\"gap\">②</span>」特約は無効（借主は減額請求できる）。定期建物賃貸借に <span class=\"gap\">③</span> があれば、<span class=\"gap\">④</span> が排除される（38条9項）。", "back": "賃料の特約：借地（11条）も普通借家（32条）も、「<mark>増額しない</mark>」特約だけ有効で、「<mark>減額しない</mark>」特約は無効（借主は減額請求できる）。定期建物賃貸借に <mark>賃料改定の特約</mark> があれば、<mark>増減請求そのもの</mark> が排除される（38条9項）。", "kind": "cloze", "id": "c020"}, {"sec": 1, "sub": "借家：期間・更新・終了", "front": "33条 造作買取請求権：賃貸人の同意を得て付けた造作を、期間満了・解約申入れで終わるとき、<b>賃借人</b>が<b>賃貸人</b>に <span class=\"gap\">①</span> で買い取るよう請求できる。この権利は <span class=\"gap\">②</span>。賃借人の <span class=\"gap\">③</span> による解除のときは行使できない（判例）。", "back": "33条 造作買取請求権：賃貸人の同意を得て付けた造作を、期間満了・解約申入れで終わるとき、<b>賃借人</b>が<b>賃貸人</b>に <mark>時価</mark> で買い取るよう請求できる。この権利は <mark>特約で排除できる</mark>。賃借人の <mark>債務不履行</mark> による解除のときは行使できない（判例）。", "kind": "cloze", "id": "c021"}, {"sec": 1, "sub": "借家：期間・更新・終了", "front": "34条 転貸借の終了：原賃貸借が期間満了や解約申入れで終わるとき、<span class=\"gap\">①</span>（原賃貸借の貸主）が <span class=\"gap\">②</span> に通知しなければ、終了を転借人に対抗できない。通知の日から <span class=\"gap\">③</span> で転貸借も終わる。", "back": "34条 転貸借の終了：原賃貸借が期間満了や解約申入れで終わるとき、<mark>建物の賃貸人</mark>（原賃貸借の貸主）が <mark>転借人</mark> に通知しなければ、終了を転借人に対抗できない。通知の日から <mark>6か月</mark> で転貸借も終わる。", "kind": "cloze", "id": "c022"}, {"sec": 1, "sub": "借家：期間・更新・終了", "front": "36条：居住用建物の<b>賃借人</b>が相続人なしに死亡したとき、事実上の夫婦・養親子として <span class=\"gap\">①</span> が賃借人の権利義務を承継する。承継したくなければ、死亡を知ってから <span class=\"gap\">②</span> に <span class=\"gap\">③</span> に反対の意思を表示する。定期建物賃貸借にも適用される。", "back": "36条：居住用建物の<b>賃借人</b>が相続人なしに死亡したとき、事実上の夫婦・養親子として <mark>同居していた者</mark> が賃借人の権利義務を承継する。承継したくなければ、死亡を知ってから <mark>1か月以内</mark> に <mark>賃貸人</mark> に反対の意思を表示する。定期建物賃貸借にも適用される。", "kind": "cloze", "id": "c023"}, {"sec": 1, "sub": "借家：期間・更新・終了", "front": "民法605条の2 建物が譲渡されたとき：引渡しを受けた<b>借家人</b>は新所有者に賃借権を対抗でき、賃貸人の地位は <span class=\"gap\">①</span>（借家人の承諾は不要）。新所有者が借家人に賃料を請求するには <span class=\"gap\">②</span> が要る。ただし <span class=\"gap\">③</span> が「地位を譲渡人に留保し、譲受人が譲渡人に賃貸する」と合意すれば移らない。", "back": "民法605条の2 建物が譲渡されたとき：引渡しを受けた<b>借家人</b>は新所有者に賃借権を対抗でき、賃貸人の地位は <mark>当然に新所有者へ移る</mark>（借家人の承諾は不要）。新所有者が借家人に賃料を請求するには <mark>所有権移転登記</mark> が要る。ただし <mark>譲渡人と譲受人</mark> が「地位を譲渡人に留保し、譲受人が譲渡人に賃貸する」と合意すれば移らない。", "kind": "cloze", "id": "c024"}, {"sec": 1, "sub": "定期建物賃貸借（38条）", "front": "★ 契約は <span class=\"gap\">①</span> または <span class=\"gap\">②</span> で行う（公正証書に限らない）。<b>賃貸人</b>は契約前に<b>賃借人</b>に対し、更新がなく期間満了で終了する旨を<span class=\"gap\">③</span> で説明する。この書面は <span class=\"gap\">④</span> でなければならない（判例）。", "back": "★ 契約は <mark>書面</mark> または <mark>電磁的記録</mark> で行う（公正証書に限らない）。<b>賃貸人</b>は契約前に<b>賃借人</b>に対し、更新がなく期間満了で終了する旨を<mark>書面（または電磁的方法）</mark> で説明する。この書面は <mark>契約書とは別の書面</mark> でなければならない（判例）。", "kind": "cloze", "id": "c025"}, {"sec": 1, "sub": "定期建物賃貸借（38条）", "front": "事前の説明を怠ると <span class=\"gap\">①</span> が無効になり、<span class=\"gap\">②</span> になる。期間の上限・下限は <span class=\"gap\">③</span>（1年未満でも可）。", "back": "事前の説明を怠ると <mark>更新がない定め</mark> が無効になり、<mark>普通建物賃貸借</mark> になる。期間の上限・下限は <mark>なし</mark>（1年未満でも可）。", "kind": "cloze", "id": "c026"}, {"sec": 1, "sub": "定期建物賃貸借（38条）", "front": "終了通知（38条6項）：期間が <span class=\"gap\">①</span> のとき、<b>賃貸人</b>は期間満了の <span class=\"gap\">②</span> から <span class=\"gap\">③</span> までに<b>賃借人</b>に終了を通知しないと、終了を賃借人に対抗できない。遅れて通知したときは、通知から <span class=\"gap\">④</span> 後に対抗できる。", "back": "終了通知（38条6項）：期間が <mark>1年以上</mark> のとき、<b>賃貸人</b>は期間満了の <mark>1年前</mark> から <mark>6か月前</mark> までに<b>賃借人</b>に終了を通知しないと、終了を賃借人に対抗できない。遅れて通知したときは、通知から <mark>6か月</mark> 後に対抗できる。", "kind": "cloze", "id": "c027"}, {"sec": 1, "sub": "定期建物賃貸借（38条）", "front": "中途解約：床面積 <span class=\"gap\">①</span> の <span class=\"gap\">②</span> 建物で、転勤・療養などやむを得ない事情があるとき、<span class=\"gap\">③</span> から解約を申し入れられる（賃貸人からは不可）。申入れから <span class=\"gap\">④</span> で終了する。", "back": "中途解約：床面積 <mark>200㎡未満</mark> の <mark>居住用</mark> 建物で、転勤・療養などやむを得ない事情があるとき、<mark>賃借人</mark> から解約を申し入れられる（賃貸人からは不可）。申入れから <mark>1か月</mark> で終了する。", "kind": "cloze", "id": "c028"}, {"sec": 2, "sub": "", "front": "申請期限（相続登記・★ 住所・氏名等の変更登記）", "back": "<span class=\"k\">相続登記：</span>所有権の取得を知った日から <b>3年</b>以内（遺産分割で取得したときは分割の日から3年）<br><span class=\"k\">★ 住所・氏名等の変更登記：</span>変更日から <b>2年</b>以内", "kind": "row", "id": "c029"}, {"sec": 2, "sub": "", "front": "正当な理由なく怠ると（相続登記・★ 住所・氏名等の変更登記）", "back": "<span class=\"k\">相続登記：</span><b>10万円</b>以下の過料<br><span class=\"k\">★ 住所・氏名等の変更登記：</span><b>5万円</b>以下の過料", "kind": "row", "id": "c030"}, {"sec": 2, "sub": "", "front": "義務化より前のものは（相続登記・★ 住所・氏名等の変更登記）", "back": "<span class=\"k\">相続登記：</span><b>対象になる</b>（義務化の日から3年以内）<br><span class=\"k\">★ 住所・氏名等の変更登記：</span><b>対象になる</b>（義務化の日から2年以内）", "kind": "row", "id": "c031"}, {"sec": 2, "sub": "", "front": "所有権保存登記を申請できる者（74条1項）", "back": "① <b>表題部所有者</b>またはその相続人その他の一般承継人 ② 所有権を有することが<b>確定判決</b>によって確認された者 ③ <b>収用</b>によって所有権を取得した者", "kind": "row", "id": "c032"}, {"sec": 2, "sub": "", "front": "表題部所有者から売買で取得した者は直接申請できるか", "back": "原則<b>できない</b>（表題部所有者名義で保存登記をしてから移転登記）。ただし<b>区分建物</b>（マンション）は、表題部所有者から取得した者も<b>直接申請できる</b>（74条2項）", "kind": "row", "id": "c033"}, {"sec": 2, "sub": "", "front": "持分の一部を譲り受けた者", "back": "保存登記を<b>申請できない</b>（表題部所有者との共有名義でもできない）。まず表題部所有者名義で保存登記をする", "kind": "row", "id": "c034"}, {"sec": 2, "sub": "", "front": "共同相続人の1人", "back": "<b>自分の持分だけ</b>の保存登記はできない。<b>相続人全員の共有名義</b>ならできる", "kind": "row", "id": "c035"}, {"sec": 2, "sub": "", "front": "単独で申請できる登記", "back": "<b>相続</b>・法人の合併／<b>相続人に対する遺贈</b>（相続人以外への遺贈は共同申請）／確定判決による登記／登記名義人の<b>氏名・住所の変更</b>／<b>収用</b>による所有権移転（起業者が単独）／買戻し特約は契約の日から<b>10年</b>を過ぎれば登記権利者が単独で抹消できる／表示に関する登記", "kind": "row", "id": "c036"}, {"sec": 2, "sub": "", "front": "登記識別情報", "back": "共同申請では登記義務者の識別情報を提供する。<b>代理人（司法書士など）に頼んでも省略できない</b>。登記権利者が通知を希望しなければ通知されない", "kind": "row", "id": "c037"}, {"sec": 2, "sub": "", "front": "附属書類（申請書など）の閲覧", "back": "<b>正当な理由がある部分に限る</b>。登記事項証明書・登記事項要約書は誰でも請求できる", "kind": "row", "id": "c038"}, {"sec": 2, "sub": "", "front": "表示に関する登記の申請期限", "back": "表題登記・滅失の登記・地目や地積の変更の登記は <b>1か月以内</b>", "kind": "row", "id": "c039"}, {"sec": 2, "sub": "", "front": "仮登記", "back": "原則は共同申請だが、仮登記義務者の<b>承諾</b>があれば仮登記権利者が単独で申請できる。本登記には登記上の利害関係人の承諾が必要", "kind": "row", "id": "c040"}, {"sec": 2, "sub": "", "front": "共有物分割禁止の定めの変更登記", "back": "その権利の共有者である<b>登記名義人の全員が共同</b>で申請する", "kind": "row", "id": "c041"}, {"sec": 3, "sub": "", "front": "内容（3条・4条・5条）", "back": "<span class=\"k\">3条：</span>権利移動<br><span class=\"k\">4条：</span>自己転用<br><span class=\"k\">5条：</span>転用目的の権利移動", "kind": "row", "id": "c042"}, {"sec": 3, "sub": "", "front": "許可権者（3条・4条・5条）", "back": "<span class=\"k\">3条：</span><b>農業委員会</b><br><span class=\"k\">4条：</span><b>知事等</b><br><span class=\"k\">5条：</span><b>知事等</b>", "kind": "row", "id": "c043"}, {"sec": 3, "sub": "", "front": "市街化区域の特例（3条・4条・5条）", "back": "<span class=\"k\">3条：</span><b>なし（許可が必要）</b><br><span class=\"k\">4条：</span>農業委員会に<b>届出</b><br><span class=\"k\">5条：</span>農業委員会に<b>届出</b>", "kind": "row", "id": "c044"}, {"sec": 3, "sub": "", "front": "採草放牧地（3条・4条・5条）", "back": "<span class=\"k\">3条：</span>○<br><span class=\"k\">4条：</span><b>×</b>（対象外）<br><span class=\"k\">5条：</span>○", "kind": "row", "id": "c045"}, {"sec": 3, "sub": "", "front": "違反の効果（3条・4条・5条）", "back": "<span class=\"k\">3条：</span>契約<b>無効</b>＋罰則<br><span class=\"k\">4条：</span>原状回復命令＋罰則<br><span class=\"k\">5条：</span>契約<b>無効</b>＋原状回復命令＋罰則", "kind": "row", "id": "c046"}, {"sec": 3, "sub": "", "front": "主な例外（3条・4条・5条）", "back": "<span class=\"k\">3条：</span>相続・遺産分割・時効取得（<b>農業委員会に届出</b>）、国・都道府県、土地収用<br><span class=\"k\">4条：</span><b>2アール未満</b>の自己の農業用施設、国・都道府県等、土地収用<br><span class=\"k\">5条：</span>国・都道府県等、土地収用", "kind": "row", "id": "c047"}, {"sec": 3, "sub": "", "front": "農地かどうかの判定基準", "back": "<b>登記地目ではなく現況</b>（遊休化していても農地）", "kind": "row", "id": "c048"}, {"sec": 3, "sub": "", "front": "遺贈で取得するとき（3条）", "back": "<b>包括遺贈</b>と<b>相続人への特定遺贈</b>は許可不要（届出）。許可が要るのは<b>相続人以外への特定遺贈</b>だけ", "kind": "row", "id": "c049"}, {"sec": 3, "sub": "", "front": "家庭菜園は農地か", "back": "<b>ならない</b>（耕作の目的に供される土地に当たらない）", "kind": "row", "id": "c050"}, {"sec": 3, "sub": "", "front": "競売でも3条許可は必要か", "back": "<b>必要</b>", "kind": "row", "id": "c051"}, {"sec": 3, "sub": "", "front": "一時的な転用でも許可は必要か", "back": "<b>必要</b>（4条・5条とも）", "kind": "row", "id": "c052"}, {"sec": 4, "sub": "面積の数字", "front": "市街化区域（開発許可が必要な規模・事後届出が必要な規模・備考）", "back": "<span class=\"k\">開発許可が必要な規模：</span><b>1,000㎡</b>以上<br><span class=\"k\">事後届出が必要な規模：</span><b>2,000㎡</b>以上<br><span class=\"k\">備考：</span>三大都市圏の一定区域は開発500㎡以上", "kind": "row", "id": "c053"}, {"sec": 4, "sub": "面積の数字", "front": "市街化調整区域（開発許可が必要な規模・事後届出が必要な規模・備考）", "back": "<span class=\"k\">開発許可が必要な規模：</span><b>規模を問わず全部</b><br><span class=\"k\">事後届出が必要な規模：</span><b>5,000㎡</b>以上<br><span class=\"k\">備考：</span>許可不要の規模はゼロ", "kind": "row", "id": "c054"}, {"sec": 4, "sub": "面積の数字", "front": "非線引き都市計画区域（開発許可が必要な規模・事後届出が必要な規模・備考）", "back": "<span class=\"k\">開発許可が必要な規模：</span><b>3,000㎡</b>以上<br><span class=\"k\">事後届出が必要な規模：</span><b>5,000㎡</b>以上<br><span class=\"k\">備考：</span>", "kind": "row", "id": "c055"}, {"sec": 4, "sub": "面積の数字", "front": "準都市計画区域（開発許可が必要な規模・事後届出が必要な規模・備考）", "back": "<span class=\"k\">開発許可が必要な規模：</span><b>3,000㎡</b>以上<br><span class=\"k\">事後届出が必要な規模：</span><b>10,000㎡</b>以上<br><span class=\"k\">備考：</span>国土法では「都市計画区域外」扱い", "kind": "row", "id": "c056"}, {"sec": 4, "sub": "面積の数字", "front": "都市計画区域外（開発許可が必要な規模・事後届出が必要な規模・備考）", "back": "<span class=\"k\">開発許可が必要な規模：</span><b>10,000㎡</b>以上<br><span class=\"k\">事後届出が必要な規模：</span><b>10,000㎡</b>以上<br><span class=\"k\">備考：</span>注視区域は事前届出／規制区域は許可", "kind": "row", "id": "c057"}, {"sec": 4, "sub": "開発行為の定義", "front": "開発行為の定義", "back": "<b>建築物の建築または特定工作物の建設</b>のために行う<b>土地の区画形質の変更</b>。青空駐車場・資材置場にするだけなら<b>開発行為ではない</b>", "kind": "row", "id": "c058"}, {"sec": 4, "sub": "開発行為の定義", "front": "第一種特定工作物", "back": "コンクリートプラント、アスファルトプラント、危険物貯蔵施設。<b>面積を問わない</b>", "kind": "row", "id": "c059"}, {"sec": 4, "sub": "開発行為の定義", "front": "第二種特定工作物", "back": "<b>ゴルフコースは面積を問わない</b>。野球場・庭球場・遊園地・墓園・動物園は <b>1ha以上</b>", "kind": "row", "id": "c060"}, {"sec": 4, "sub": "開発行為の定義", "front": "開発許可の申請書に書くもの", "back": "予定建築物等の<b>用途</b>（構造・設備は書かない）", "kind": "row", "id": "c061"}, {"sec": 4, "sub": "開発行為の定義", "front": "開発区域を変更するとき", "back": "原則として<b>知事の許可</b>（軽微な変更は届出）", "kind": "row", "id": "c062"}, {"sec": 4, "sub": "許可不要の例外（規模を問わない） ※穴埋め", "front": "① <span class=\"gap\">①</span>用の建築物、および<span class=\"gap\">②</span>建築物。ただし <span class=\"gap\">③</span> 内ではこの例外は使えない（＝許可が必要）。", "back": "① <mark>農林漁業</mark>用の建築物、および<mark>農林漁業を営む者の居住の用に供する</mark>建築物。ただし <mark>市街化区域</mark> 内ではこの例外は使えない（＝許可が必要）。", "kind": "cloze", "id": "c063"}, {"sec": 4, "sub": "許可不要の例外（規模を問わない） ※穴埋め", "front": "② <span class=\"gap\">①</span>。駅舎・図書館・公民館・<span class=\"gap\">②</span>など。<span class=\"gap\">③</span> は含まれない（＝許可が必要）。", "back": "② <mark>公益的建築物</mark>。駅舎・図書館・公民館・<mark>変電所</mark>など。<mark>学校・医療施設・社会福祉施設</mark> は含まれない（＝許可が必要）。", "kind": "cloze", "id": "c064"}, {"sec": 4, "sub": "許可不要の例外（規模を問わない） ※穴埋め", "front": "③ <span class=\"gap\">①</span>・土地区画整理事業・市街地再開発事業等の施行として行うもの。", "back": "③ <mark>都市計画事業</mark>・土地区画整理事業・市街地再開発事業等の施行として行うもの。", "kind": "cloze", "id": "c065"}, {"sec": 4, "sub": "許可不要の例外（規模を問わない） ※穴埋め", "front": "④ <span class=\"gap\">①</span>のため必要な応急措置、通常の管理行為・軽易な行為。国・都道府県等が行う場合は、知事との <span class=\"gap\">②</span> すれば許可があったものとみなされる。", "back": "④ <mark>非常災害</mark>のため必要な応急措置、通常の管理行為・軽易な行為。国・都道府県等が行う場合は、知事との <mark>協議が成立</mark> すれば許可があったものとみなされる。", "kind": "cloze", "id": "c066"}, {"sec": 4, "sub": "許可不要の例外（規模を問わない） ※穴埋め", "front": "準都市計画区域内で、漁業を営む者の住宅のために3,000㎡の区画形質の変更を行う→ 許可は <span class=\"gap\">①</span>。理由：<span class=\"gap\">②</span>", "back": "準都市計画区域内で、漁業を営む者の住宅のために3,000㎡の区画形質の変更を行う→ 許可は <mark>不要</mark>。理由：<mark>市街化区域ではないので農林漁業の例外が使える</mark>", "kind": "cloze", "id": "c067"}, {"sec": 4, "sub": "許可不要の例外（規模を問わない） ※穴埋め", "front": "市街化調整区域内で、変電所のために2,000㎡の区画形質の変更を行う→ 許可は <span class=\"gap\">①</span>。理由：<span class=\"gap\">②</span>", "back": "市街化調整区域内で、変電所のために2,000㎡の区画形質の変更を行う→ 許可は <mark>不要</mark>。理由：<mark>変電所は公益的建築物に当たる</mark>", "kind": "cloze", "id": "c068"}, {"sec": 4, "sub": "許可不要の例外（規模を問わない） ※穴埋め", "front": "市街化区域内で、非常災害の応急措置として4,000㎡の開発行為を行う→ 許可は <span class=\"gap\">①</span>。理由：<span class=\"gap\">②</span>", "back": "市街化区域内で、非常災害の応急措置として4,000㎡の開発行為を行う→ 許可は <mark>不要</mark>。理由：<mark>非常災害の例外に規模の制限はない</mark>", "kind": "cloze", "id": "c069"}, {"sec": 4, "sub": "市街化調整区域の43条（開発区域以外の区域） ※穴埋め", "front": "市街化調整区域のうち、開発許可を受けた開発区域 <span class=\"gap\">①</span> の区域内で建築物を新築等する場合、原則として <span class=\"gap\">②</span> の許可が必要。", "back": "市街化調整区域のうち、開発許可を受けた開発区域 <mark>以外</mark> の区域内で建築物を新築等する場合、原則として <mark>都道府県知事</mark> の許可が必要。", "kind": "cloze", "id": "c070"}, {"sec": 4, "sub": "市街化調整区域の43条（開発区域以外の区域） ※穴埋め", "front": "「知事の許可を受けた場合、又は都市計画事業の施行として行う場合<b>に限り</b>建築できる」という記述は<span class=\"gap\">①</span>。理由：<span class=\"gap\">②</span>", "back": "「知事の許可を受けた場合、又は都市計画事業の施行として行う場合<b>に限り</b>建築できる」という記述は<mark>誤り</mark>。理由：<mark>農林漁業用・公益的建築物・非常災害の応急措置など、ほかにも例外が多数ある</mark>", "kind": "cloze", "id": "c071"}, {"sec": 4, "sub": "国土利用計画法の事後届出", "front": "義務者・期限・届出先", "back": "<b>権利取得者（買主）</b>／<b>契約締結日から2週間以内</b>／<b>市町村長を経由して知事</b>", "kind": "row", "id": "c072"}, {"sec": 4, "sub": "国土利用計画法の事後届出", "front": "勧告の対象・期間", "back": "<b>利用目的のみ</b>（対価の額は対象外）／<b>3週間</b>以内（6週間まで延長可）", "kind": "row", "id": "c073"}, {"sec": 4, "sub": "国土利用計画法の事後届出", "front": "勧告に従わない場合", "back": "<b>公表できる</b>。ただし<b>契約は有効</b>で<b>罰則もない</b>（届出自体をしないと罰則あり）", "kind": "row", "id": "c074"}, {"sec": 4, "sub": "国土利用計画法の事後届出", "front": "一団の土地の判定", "back": "<b>買主基準</b>。当事者の一方が国・地方公共団体等なら届出不要", "kind": "row", "id": "c075"}, {"sec": 4, "sub": "国土利用計画法の事後届出", "front": "停止条件付きの契約", "back": "届出期限は<b>契約締結日</b>から2週間（条件成就の日からではない）", "kind": "row", "id": "c076"}, {"sec": 4, "sub": "国土利用計画法の事後届出", "front": "助言に従わない場合", "back": "<b>公表されない</b>（公表があるのは勧告に従わないときだけ）", "kind": "row", "id": "c077"}, {"sec": 4, "sub": "国土利用計画法の事後届出", "front": "相続・贈与など対価のない取得", "back": "届出<b>不要</b>", "kind": "row", "id": "c078"}, {"sec": 5, "sub": "", "front": "組合員の範囲：施行地区内の宅地について <span class=\"gap\">①</span> を有する者は <span class=\"gap\">②</span> 組合員になる。<span class=\"gap\">③</span> 自動的に組合員になる（「4分の3以上が組合員」は誤り）。", "back": "組合員の範囲：施行地区内の宅地について <mark>所有権または借地権</mark> を有する者は <mark>すべて</mark> 組合員になる。<mark>設立に反対した者も</mark> 自動的に組合員になる（「4分の3以上が組合員」は誤り）。", "kind": "cloze", "id": "c079"}, {"sec": 5, "sub": "", "front": "組合の設立：<span class=\"gap\">①</span> が共同して定款・事業計画を定め、<span class=\"gap\">②</span> の認可を受ける。", "back": "組合の設立：<mark>7人以上</mark> が共同して定款・事業計画を定め、<mark>都道府県知事</mark> の認可を受ける。", "kind": "cloze", "id": "c080"}, {"sec": 5, "sub": "", "front": "参加組合員になれるのは <span class=\"gap\">①</span>・地方住宅供給公社など政令で定める者だけ（資力・信用があっても一般の者はなれない）。", "back": "参加組合員になれるのは <mark>都市再生機構</mark>・地方住宅供給公社など政令で定める者だけ（資力・信用があっても一般の者はなれない）。", "kind": "cloze", "id": "c081"}, {"sec": 5, "sub": "", "front": "総会は組合員の <span class=\"gap\">①</span> の出席で開き、出席組合員の <span class=\"gap\">②</span> で決する（可否同数なら <span class=\"gap\">③</span>）。役員は理事 <span class=\"gap\">④</span>・監事 <span class=\"gap\">⑤</span>。", "back": "総会は組合員の <mark>半数以上</mark> の出席で開き、出席組合員の <mark>過半数</mark> で決する（可否同数なら <mark>議長</mark>）。役員は理事 <mark>5人以上</mark>・監事 <mark>2人以上</mark>。", "kind": "cloze", "id": "c082"}, {"sec": 5, "sub": "", "front": "設立に必要な同意：所有権者・借地権者の <span class=\"gap\">①</span>。", "back": "設立に必要な同意：所有権者・借地権者の <mark>それぞれ3分の2以上</mark>。", "kind": "cloze", "id": "c083"}, {"sec": 5, "sub": "", "front": "設立認可の申請後、知事は市町村長に事業計画を <span class=\"gap\">①</span> 公衆の縦覧に供させる。", "back": "設立認可の申請後、知事は市町村長に事業計画を <mark>2週間</mark> 公衆の縦覧に供させる。", "kind": "cloze", "id": "c084"}, {"sec": 5, "sub": "", "front": "保留地：組合施行では、施行前後で宅地価額の総額が <span class=\"gap\">①</span>、定款で定める目的のため <span class=\"gap\">②</span> を経て定められる（公的施行と異なる）。", "back": "保留地：組合施行では、施行前後で宅地価額の総額が <mark>増えなくても</mark>、定款で定める目的のため <mark>総会の特別議決</mark> を経て定められる（公的施行と異なる）。", "kind": "cloze", "id": "c085"}, {"sec": 5, "sub": "", "front": "仮換地の使用収益開始日は、効力発生日とは <span class=\"gap\">①</span>。その間は誰も使用収益できず、損失は <span class=\"gap\">②</span> される。", "back": "仮換地の使用収益開始日は、効力発生日とは <mark>別に定めることができる</mark>。その間は誰も使用収益できず、損失は <mark>補償</mark> される。", "kind": "cloze", "id": "c086"}, {"sec": 5, "sub": "", "front": "仮換地の指定後も、従前の宅地について <span class=\"gap\">①</span>（処分権は従前の宅地に残る＝第1回 問20）。", "back": "仮換地の指定後も、従前の宅地について <mark>抵当権を設定できる</mark>（処分権は従前の宅地に残る＝第1回 問20）。", "kind": "cloze", "id": "c087"}, {"sec": 5, "sub": "", "front": "換地処分は、関係権利者に換地計画の関係事項を <span class=\"gap\">①</span> して行う。原則として、換地計画に係る区域の <span class=\"gap\">②</span>。", "back": "換地処分は、関係権利者に換地計画の関係事項を <mark>通知</mark> して行う。原則として、換地計画に係る区域の <mark>全部の工事が完了した後</mark>。", "kind": "cloze", "id": "c088"}, {"sec": 5, "sub": "", "front": "換地処分の公告があった日の <span class=\"gap\">①</span>：換地が従前の宅地とみなされる／<span class=\"gap\">②</span> を施行者が取得する／清算金が確定する。", "back": "換地処分の公告があった日の <mark>翌日</mark>：換地が従前の宅地とみなされる／<mark>保留地</mark> を施行者が取得する／清算金が確定する。", "kind": "cloze", "id": "c089"}, {"sec": 5, "sub": "", "front": "公告があった日が <span class=\"gap\">①</span>：換地を定めなかった従前の宅地の権利と、行使する利益がなくなった <span class=\"gap\">②</span> が消滅する。それ以外の地役権は <span class=\"gap\">③</span>。", "back": "公告があった日が <mark>終了した時</mark>：換地を定めなかった従前の宅地の権利と、行使する利益がなくなった <mark>地役権</mark> が消滅する。それ以外の地役権は <mark>従前の宅地の上に残る</mark>。", "kind": "cloze", "id": "c090"}, {"sec": 5, "sub": "", "front": "換地処分の公告後、施行者は <span class=\"gap\">①</span> 登記所に通知する。", "back": "換地処分の公告後、施行者は <mark>直ちに</mark> 登記所に通知する。", "kind": "cloze", "id": "c091"}, {"sec": 5, "sub": "", "front": "登記の申請が制限されるのは <span class=\"gap\">①</span> の後。<span class=\"gap\">②</span> の後ではない。", "back": "登記の申請が制限されるのは <mark>換地処分の公告</mark> の後。<mark>仮換地の指定</mark> の後ではない。", "kind": "cloze", "id": "c092"}, {"sec": 5, "sub": "", "front": "審議会が置かれるのは <span class=\"gap\">①</span> のみ。組合施行では総会等の同意による。", "back": "審議会が置かれるのは <mark>公的施行</mark> のみ。組合施行では総会等の同意による。", "kind": "cloze", "id": "c093"}, {"sec": 6, "sub": "", "front": "実施主体は <span class=\"gap\">①</span>。価格時点は毎年 <span class=\"gap\">②</span>、<span class=\"gap\">③</span> に官報で公示する。", "back": "実施主体は <mark>土地鑑定委員会</mark>。価格時点は毎年 <mark>1月1日</mark>、<mark>3月</mark> に官報で公示する。", "kind": "cloze", "id": "c094"}, {"sec": 6, "sub": "", "front": "標準地の鑑定評価を行う不動産鑑定士は <span class=\"gap\">①</span>。", "back": "標準地の鑑定評価を行う不動産鑑定士は <mark>2人以上</mark>。", "kind": "cloze", "id": "c095"}, {"sec": 6, "sub": "", "front": "正常な価格とは、建物がある場合・地上権がある場合でも<span class=\"gap\">①</span> として判定した価格をいう。", "back": "正常な価格とは、建物がある場合・地上権がある場合でも<mark>それらが存しないもの</mark> として判定した価格をいう。", "kind": "cloze", "id": "c096"}, {"sec": 6, "sub": "", "front": "一般の取引者は、公示価格を指標として取引を行うよう <span class=\"gap\">①</span>。", "back": "一般の取引者は、公示価格を指標として取引を行うよう <mark>努めなければならない（努力義務）</mark>。", "kind": "cloze", "id": "c097"}, {"sec": 6, "sub": "", "front": "不動産鑑定士は、公示区域内で鑑定評価をするとき<span class=\"gap\">①</span>。", "back": "不動産鑑定士は、公示区域内で鑑定評価をするとき<mark>公示価格を規準としなければならない（義務）</mark>。", "kind": "cloze", "id": "c098"}, {"sec": 6, "sub": "", "front": "収用事業者は、取得価格を定めるとき<span class=\"gap\">①</span>。", "back": "収用事業者は、取得価格を定めるとき<mark>公示価格を規準としなければならない（義務）</mark>。", "kind": "cloze", "id": "c099"}, {"sec": 7, "sub": "", "front": "特定の用途を中心に地域的なまとまりを示す、対象不動産の属する用途的地域は <span class=\"gap\">①</span>。近隣地域と特性が似た地域は <span class=\"gap\">②</span>。代替関係が成り立ち価格が相互に影響し合う不動産のある圏域は <span class=\"gap\">③</span>。", "back": "特定の用途を中心に地域的なまとまりを示す、対象不動産の属する用途的地域は <mark>近隣地域</mark>。近隣地域と特性が似た地域は <mark>類似地域</mark>。代替関係が成り立ち価格が相互に影響し合う不動産のある圏域は <mark>同一需給圏</mark>。", "kind": "cloze", "id": "c100"}, {"sec": 7, "sub": "", "front": "価格の原則は <span class=\"gap\">①</span>。隣地の併合や借地権者の底地購入など、市場が相対的に限定される場合は <span class=\"gap\">②</span>。", "back": "価格の原則は <mark>正常価格</mark>。隣地の併合や借地権者の底地購入など、市場が相対的に限定される場合は <mark>限定価格</mark>。", "kind": "cloze", "id": "c101"}, {"sec": 7, "sub": "", "front": "法令等による社会的要請を背景とする評価目的で、正常価格の前提条件を満たさない場合は <span class=\"gap\">①</span>（例：民事再生法に基づく <span class=\"gap\">②</span>）。文化財など一般に市場性がない不動産は <span class=\"gap\">③</span>。", "back": "法令等による社会的要請を背景とする評価目的で、正常価格の前提条件を満たさない場合は <mark>特定価格</mark>（例：民事再生法に基づく <mark>早期売却</mark>）。文化財など一般に市場性がない不動産は <mark>特殊価格</mark>。", "kind": "cloze", "id": "c102"}, {"sec": 7, "sub": "", "front": "原価法：<span class=\"gap\">①</span> を求めて <span class=\"gap\">②</span> し、<span class=\"gap\">③</span> を出す。土地だけでも <span class=\"gap\">④</span> のように再調達原価を求められれば使える。", "back": "原価法：<mark>再調達原価</mark> を求めて <mark>減価修正</mark> し、<mark>積算価格</mark> を出す。土地だけでも <mark>造成地・埋立地</mark> のように再調達原価を求められれば使える。", "kind": "cloze", "id": "c103"}, {"sec": 7, "sub": "", "front": "取引事例比較法：<span class=\"gap\">①</span>・<span class=\"gap\">②</span>・地域要因と個別的要因の比較をして <span class=\"gap\">③</span> を出す。<span class=\"gap\">④</span> の事例は使えない。", "back": "取引事例比較法：<mark>事情補正</mark>・<mark>時点修正</mark>・地域要因と個別的要因の比較をして <mark>比準価格</mark> を出す。<mark>投機的取引</mark> の事例は使えない。", "kind": "cloze", "id": "c104"}, {"sec": 7, "sub": "", "front": "収益還元法：将来の純収益の現在価値の総和で <span class=\"gap\">①</span> を出す（直接還元法・<span class=\"gap\">②</span>）。<span class=\"gap\">③</span> にも、賃貸を想定して使える。", "back": "収益還元法：将来の純収益の現在価値の総和で <mark>収益価格</mark> を出す（直接還元法・<mark>DCF法</mark>）。<mark>自用の不動産</mark> にも、賃貸を想定して使える。", "kind": "cloze", "id": "c105"}, {"sec": 7, "sub": "", "front": "手法は、原則として <span class=\"gap\">①</span> を適用する。価格は、効用が <span class=\"gap\">②</span> に発揮される使用を前提に形成される（最有効使用の原則）。", "back": "手法は、原則として <mark>複数</mark> を適用する。価格は、効用が <mark>最高度</mark> に発揮される使用を前提に形成される（最有効使用の原則）。", "kind": "cloze", "id": "c106"}, {"sec": 8, "sub": "", "front": "課税主体・徴収方法", "back": "<b>都道府県</b>・<b>普通徴収</b>", "kind": "row", "id": "c107"}, {"sec": 8, "sub": "", "front": "課税対象", "back": "<b>土地と家屋のみ</b>（立木や機械は対象外）", "kind": "row", "id": "c108"}, {"sec": 8, "sub": "", "front": "税率", "back": "土地・住宅は <b>3%</b>／住宅以外の家屋は <b>4%</b>", "kind": "row", "id": "c109"}, {"sec": 8, "sub": "", "front": "★ 免税点", "back": "土地 <b>16万円</b>／家屋の建築（新築・増改築） <b>66万円</b>／家屋の承継（売買など） <b>34万円</b>", "kind": "row", "id": "c110"}, {"sec": 8, "sub": "", "front": "免税点の判定", "back": "税額ではなく、<b>課税標準となる不動産の価格</b>で判断する", "kind": "row", "id": "c111"}, {"sec": 8, "sub": "", "front": "宅地の特例", "back": "課税標準を<b>2分の1</b>にする", "kind": "row", "id": "c112"}, {"sec": 8, "sub": "", "front": "★ 新築住宅の特例", "back": "評価額から <b>1,200万円</b>（認定長期優良住宅は <b>1,300万円</b>）を控除。床面積 <b>40㎡以上240㎡以下</b>（貸家も同じ）", "kind": "row", "id": "c113"}, {"sec": 8, "sub": "", "front": "中古住宅の控除", "back": "<b>個人が自己の居住用</b>に取得した場合だけ", "kind": "row", "id": "c114"}, {"sec": 8, "sub": "", "front": "非課税", "back": "<b>相続</b>・法人の合併・包括遺贈", "kind": "row", "id": "c115"}, {"sec": 8, "sub": "", "front": "新築住宅の取得日のみなし", "back": "新築後 <b>6か月</b>（宅建業者等は1年）たっても使用・譲渡されなければ、所有者を取得者と<b>みなす</b>", "kind": "row", "id": "c116"}, {"sec": 9, "sub": "", "front": "課税主体は <span class=\"gap\">①</span>。納税義務者は <span class=\"gap\">②</span> に固定資産課税台帳に所有者として登録されている者。", "back": "課税主体は <mark>市町村</mark>。納税義務者は <mark>1月1日現在</mark> に固定資産課税台帳に所有者として登録されている者。", "kind": "cloze", "id": "c117"}, {"sec": 9, "sub": "", "front": "納税義務者の例外：<span class=\"gap\">①</span>（質権のある土地）／<span class=\"gap\">②</span> より長い地上権の地上権者／所有者が災害等で所在不明なら <span class=\"gap\">③</span>。", "back": "納税義務者の例外：<mark>質権者</mark>（質権のある土地）／<mark>100年</mark> より長い地上権の地上権者／所有者が災害等で所在不明なら <mark>使用者</mark>。", "kind": "cloze", "id": "c118"}, {"sec": 9, "sub": "", "front": "標準税率は <span class=\"gap\">①</span>。<span class=\"gap\">②</span>。", "back": "標準税率は <mark>1.4%</mark>。<mark>制限税率はない</mark>。", "kind": "cloze", "id": "c119"}, {"sec": 9, "sub": "", "front": "免税点：土地 <span class=\"gap\">①</span>／家屋 <span class=\"gap\">②</span>／償却資産 <span class=\"gap\">③</span>。", "back": "免税点：土地 <mark>30万円</mark>／家屋 <mark>20万円</mark>／償却資産 <mark>150万円</mark>。", "kind": "cloze", "id": "c120"}, {"sec": 9, "sub": "", "front": "土地の特例：住宅用地 <span class=\"gap\">①</span>、超える部分は <span class=\"gap\">②</span>。", "back": "土地の特例：住宅用地 <mark>200㎡以下は1/6</mark>、超える部分は <mark>1/3</mark>。", "kind": "cloze", "id": "c121"}, {"sec": 9, "sub": "", "front": "★ 新築住宅の特例：<span class=\"gap\">①</span>（3階建て以上の中高層耐火建築物は <span class=\"gap\">②</span>）<span class=\"gap\">③</span>。床面積 <span class=\"gap\">④</span>。減額されるのは <span class=\"gap\">⑤</span> 相当分まで。", "back": "★ 新築住宅の特例：<mark>3年間</mark>（3階建て以上の中高層耐火建築物は <mark>5年間</mark>）<mark>税額1/2</mark>。床面積 <mark>40㎡以上240㎡以下</mark>。減額されるのは <mark>120㎡</mark> 相当分まで。", "kind": "cloze", "id": "c122"}, {"sec": 9, "sub": "", "front": "評価替えは <span class=\"gap\">①</span> に1度。年途中に売却しても <span class=\"gap\">②</span> が全額負担する。", "back": "評価替えは <mark>3年</mark> に1度。年途中に売却しても <mark>1月1日の所有者</mark> が全額負担する。", "kind": "cloze", "id": "c123"}, {"sec": 10, "sub": "保証協会", "front": "加入しようとするとき", "back": "加入しようとする<b>日まで</b>に分担金を納付", "kind": "row", "id": "c124"}, {"sec": 10, "sub": "保証協会", "front": "分担金の額", "back": "主たる事務所 <b>60万円</b>／その他の事務所1か所につき <b>30万円</b>", "kind": "row", "id": "c125"}, {"sec": 10, "sub": "保証協会", "front": "事務所を新設したとき", "back": "設置した日から <b>2週間以内</b>に納付", "kind": "row", "id": "c126"}, {"sec": 10, "sub": "保証協会", "front": "協会が供託所へ供託", "back": "納付を受けた日から <b>1週間以内</b>", "kind": "row", "id": "c127"}, {"sec": 10, "sub": "保証協会", "front": "還付があったとき、協会が供託", "back": "国土交通大臣の通知を受けた日から <b>2週間以内</b>", "kind": "row", "id": "c128"}, {"sec": 10, "sub": "保証協会", "front": "業者が還付充当金を納付", "back": "協会の通知を受けた日から <b>2週間以内</b>（納付しないと社員の地位を失う）", "kind": "row", "id": "c129"}, {"sec": 10, "sub": "保証協会", "front": "社員の地位を失ったとき", "back": "その日から <b>1週間以内</b>に営業保証金を供託", "kind": "row", "id": "c130"}, {"sec": 10, "sub": "保証協会", "front": "還付を受けようとする者の手続", "back": "保証協会の <b>認証</b>を受けたうえ、<b>供託所</b>に還付請求", "kind": "row", "id": "c131"}, {"sec": 10, "sub": "保証協会", "front": "保証協会が必ず行う業務", "back": "<b>苦情の解決</b>・<b>研修</b>・<b>弁済業務</b>の3つ", "kind": "row", "id": "c132"}, {"sec": 10, "sub": "保証協会", "front": "保証協会が任意で行う業務", "back": "一般保証業務・手付金等保管事業・一般社団法人への<b>研修費用の助成</b>など（「行うことができる」）", "kind": "row", "id": "c133"}, {"sec": 10, "sub": "保証協会", "front": "社員の加入・地位喪失の報告", "back": "<b>保証協会</b>が直ちに社員の免許権者へ報告する（業者が報告するのではない）", "kind": "row", "id": "c134"}, {"sec": 10, "sub": "保証協会", "front": "一行でまとめると", "back": "<b>協会が動くのは1週間、業者が金を出すのは2週間。ただし地位喪失だけは1週間。</b>", "kind": "row", "id": "c135"}, {"sec": 10, "sub": "営業保証金", "front": "供託する額", "back": "主たる事務所 <b>1,000万円</b>／その他の事務所1か所につき <b>500万円</b>", "kind": "row", "id": "c136"}, {"sec": 10, "sub": "営業保証金", "front": "供託先", "back": "<b>主たる事務所の最寄り</b>の供託所（支店を新設したときも同じ）", "kind": "row", "id": "c137"}, {"sec": 10, "sub": "営業保証金", "front": "事業を開始できるのは", "back": "供託した旨を免許権者に<b>届け出た後</b>", "kind": "row", "id": "c138"}, {"sec": 10, "sub": "営業保証金", "front": "有価証券の評価", "back": "国債 <b>100%</b>／地方債・政府保証債 <b>90%</b>／その他 <b>80%</b>", "kind": "row", "id": "c139"}, {"sec": 10, "sub": "営業保証金", "front": "変換（差替え）のため新たに供託したとき", "back": "<b>遅滞なく</b>免許権者に届け出る", "kind": "row", "id": "c140"}, {"sec": 10, "sub": "営業保証金", "front": "還付で不足したときの供託", "back": "免許権者の通知を受けた日から <b>2週間以内</b>（違反に罰則はなく、業務停止処分の対象）", "kind": "row", "id": "c141"}, {"sec": 10, "sub": "営業保証金", "front": "保証協会に加入して取り戻すとき", "back": "還付請求権者への<b>公告は不要</b>", "kind": "row", "id": "c142"}, {"sec": 11, "sub": "", "front": "有効期間（一般・専任・専属専任）", "back": "<span class=\"k\">一般：</span><b>制限なし</b><br><span class=\"k\">専任：</span><b>3か月</b>以内（超えたら3か月。自動更新は不可）<br><span class=\"k\">専属専任：</span>同左", "kind": "row", "id": "c143"}, {"sec": 11, "sub": "", "front": "指定流通機構への登録（一般・専任・専属専任）", "back": "<span class=\"k\">一般：</span>義務なし<br><span class=\"k\">専任：</span>締結から <b>7日</b>以内（休業日除く）<br><span class=\"k\">専属専任：</span>締結から <b>5日</b>以内（休業日除く）", "kind": "row", "id": "c144"}, {"sec": 11, "sub": "", "front": "業務処理状況の報告（一般・専任・専属専任）", "back": "<span class=\"k\">一般：</span>義務なし<br><span class=\"k\">専任：</span><b>2週間</b>に1回以上<br><span class=\"k\">専属専任：</span><b>1週間</b>に1回以上", "kind": "row", "id": "c145"}, {"sec": 11, "sub": "", "front": "申込みがあったときの報告（一般・専任・専属専任）", "back": "<span class=\"k\">一般：</span><b>遅滞なく</b>（全類型）<br><span class=\"k\">専任：</span>同左<br><span class=\"k\">専属専任：</span>同左", "kind": "row", "id": "c146"}, {"sec": 11, "sub": "", "front": "自己発見取引（一般・専任・専属専任）", "back": "<span class=\"k\">一般：</span>可<br><span class=\"k\">専任：</span>可<br><span class=\"k\">専属専任：</span><b>不可</b>", "kind": "row", "id": "c147"}, {"sec": 11, "sub": "", "front": "媒介契約書面に記名する者", "back": "<b>宅建業者</b>（宅建士の記名は不要）。依頼者の承諾があれば電磁的方法も可", "kind": "row", "id": "c148"}, {"sec": 11, "sub": "", "front": "既存建物のときの記載事項", "back": "<b>建物状況調査を実施する者のあっせん</b>に関する事項（あっせんしないなら「無」と書く）", "kind": "row", "id": "c149"}, {"sec": 11, "sub": "", "front": "価額について意見を述べるとき", "back": "<b>根拠を明らか</b>にする（口頭でもよく、書面に書く必要はない）", "kind": "row", "id": "c150"}, {"sec": 11, "sub": "", "front": "登録したあと", "back": "<b>登録を証する書面</b>を遅滞なく依頼者に引き渡す", "kind": "row", "id": "c151"}, {"sec": 11, "sub": "", "front": "★ 登録事項", "back": "所在・規模・形質・売買すべき価額・法令上の制限の主要なもの（専属専任はその旨）。<b>取引の申込みの受付状況</b>も。<b>登記された権利は含まない</b>", "kind": "row", "id": "c152"}, {"sec": 11, "sub": "", "front": "契約が成立したとき", "back": "遅滞なく、<b>登録番号・取引価格・契約成立年月日</b>を指定流通機構へ通知", "kind": "row", "id": "c153"}, {"sec": 11, "sub": "", "front": "建物状況調査を実施する者", "back": "<b>建築士</b>で、国土交通大臣が定める<b>講習</b>を修了した者", "kind": "row", "id": "c154"}, {"sec": 11, "sub": "", "front": "建物状況調査と広告", "back": "広告に実施の有無を明示する義務は<b>ない</b>（実施の有無と結果の概要は<b>重要事項</b>の説明事項）", "kind": "row", "id": "c155"}, {"sec": 12, "sub": "", "front": "専任宅建士（事務所）", "back": "業務に従事する者 <b>5人に1人以上</b>", "kind": "row", "id": "c156"}, {"sec": 12, "sub": "", "front": "専任宅建士（案内所）", "back": "契約行為等を行う案内所に <b>1人以上</b>", "kind": "row", "id": "c157"}, {"sec": 12, "sub": "", "front": "不足した場合", "back": "<b>2週間以内</b>に必要な措置", "kind": "row", "id": "c158"}, {"sec": 12, "sub": "", "front": "50条2項の届出", "back": "業務開始の <b>10日前</b>までに、<b>免許権者および所在地の知事</b>の両方へ", "kind": "row", "id": "c159"}, {"sec": 12, "sub": "", "front": "帳簿の保存期間", "back": "事業年度末に閉鎖し <b>5年間</b>（自ら売主となる新築住宅は <b>10年間</b>。媒介した新築住宅は5年）", "kind": "row", "id": "c160"}, {"sec": 12, "sub": "", "front": "帳簿の記載と罰則", "back": "取引のつど、年月日・所在と面積・<b>報酬の額</b>等を記載する。記載しないと <b>50万円以下の罰金</b>", "kind": "row", "id": "c161"}, {"sec": 12, "sub": "", "front": "★ 従業者名簿の保存期間と記載事項", "back": "最終記載日から <b>10年間</b>。記載事項は <b>氏名／従業者証明書番号／主たる職務内容／宅建士か否かの別／従事開始・終了年月日</b> の5つ（住所・生年月日・性別は書かない）", "kind": "row", "id": "c162"}, {"sec": 12, "sub": "", "front": "閲覧義務があるのはどちらか", "back": "<b>従業者名簿のみ</b>。帳簿に閲覧義務は<b>ない</b>", "kind": "row", "id": "c163"}, {"sec": 12, "sub": "", "front": "★ 事務所の標識（業者票）", "back": "<b>代表者氏名</b>／<b>専任宅建士の数</b>／<b>従事者の数</b>を書く（専任宅建士の<b>氏名</b>は書かない）", "kind": "row", "id": "c164"}, {"sec": 12, "sub": "", "front": "広告の規制", "back": "取引態様の別は<b>広告するとき</b>と<b>注文を受けたとき</b>の両方で明示する（数回に分けた広告は<b>すべて</b>に）。誇大広告は、注文がなく契約が成立しなくても違反。利用の制限には借地権など<b>私法上の制限</b>も含む。罰則は6月以下の拘禁刑・100万円以下の罰金（併科あり）", "kind": "row", "id": "c165"}, {"sec": 12, "sub": "", "front": "手付に関する勧誘", "back": "手付の<b>貸付け</b>や手付の<b>分割払い</b>を持ちかけての勧誘は違反（契約が成立しなくても）。<b>報酬の分割</b>や<b>代金の値引き</b>を告げるのは違反ではない", "kind": "row", "id": "c166"}, {"sec": 12, "sub": "", "front": "従業者証明書", "back": "従業者に携帯させ、取引の関係者から請求があれば提示させる。<b>宅建士証では代わりにならない</b>", "kind": "row", "id": "c167"}, {"sec": 12, "sub": "", "front": "守秘義務", "back": "業者にも従業者にもあり、<b>退職後・廃業後も</b>続く。正当な理由があれば漏らしてよい", "kind": "row", "id": "c168"}, {"sec": 13, "sub": "代理・貸借・消費税", "front": "代理", "back": "媒介の <b>2倍</b>。相手方からも受ける場合、<b>合計で2倍以内</b>", "kind": "row", "id": "c169"}, {"sec": 13, "sub": "代理・貸借・消費税", "front": "貸借（双方から合計）", "back": "借賃の <b>1.1か月分</b>", "kind": "row", "id": "c170"}, {"sec": 13, "sub": "代理・貸借・消費税", "front": "居住用建物の貸借（一方から）", "back": "<b>0.55か月分</b>。ただし<b>媒介の依頼を受けるに当たって承諾</b>を得ていれば1.1か月分まで", "kind": "row", "id": "c171"}, {"sec": 13, "sub": "代理・貸借・消費税", "front": "居住用以外（宅地・店舗・事務所）", "back": "<b>承諾不要</b>。一方から <b>1.1か月分</b>全額を受けてもよい", "kind": "row", "id": "c172"}, {"sec": 13, "sub": "代理・貸借・消費税", "front": "権利金の特例", "back": "居住用建物<b>以外</b>に限り、権利金を代金とみなして速算式で計算し、<b>高い方</b>を採用。退去時に全額返還される保証金・敷金は算定に<b>含めない</b>", "kind": "row", "id": "c173"}, {"sec": 13, "sub": "代理・貸借・消費税", "front": "消費税の掛け方", "back": "課税事業者は <b>×1.1</b>、免税事業者は <b>×1.04</b>", "kind": "row", "id": "c174"}, {"sec": 13, "sub": "代理・貸借・消費税", "front": "報酬と別に受け取れるもの", "back": "① 依頼者の<b>依頼による</b>広告の料金 ② 依頼者から特別に頼まれた支出を要する<b>特別の費用</b>（現地調査費など）で<b>事前の承諾</b>があるもの。建物状況調査の<b>あっせん料</b>や重要事項説明の対価は<b>受領できない</b>", "kind": "row", "id": "c175"}, {"sec": 13, "sub": "代理・貸借・消費税", "front": "自ら貸主・転貸の場合", "back": "<b>宅建業に当たらない</b>。報酬規制・35条・37条・8種制限・広告規制は<b>どれも及ばない</b>", "kind": "row", "id": "c176"}, {"sec": 13, "sub": "★ 空家等の特例（令和6年7月1日施行）", "front": "低廉な空家等の売買・交換（対象・上限・受けられる相手）", "back": "<span class=\"k\">対象：</span>代金 <b>800万円以下</b>（宅地も含む。空家でなくてもよい）<br><span class=\"k\">上限：</span>一方から <b>33万円</b>（税込）<br><span class=\"k\">受けられる相手：</span><b>売主からも買主からも可</b>。双方合計は <b>66万円</b>まで", "kind": "row", "id": "c177"}, {"sec": 13, "sub": "★ 空家等の特例（令和6年7月1日施行）", "front": "長期の空家等の貸借（対象・上限・受けられる相手）", "back": "<span class=\"k\">対象：</span>長期間未使用等<br><span class=\"k\">上限：</span>双方合計で借賃の <b>2.2か月分</b><br><span class=\"k\">受けられる相手：</span>上乗せは<b>貸主のみ</b>。借主からは通常額（1.1か月分、居住用は承諾なしなら0.55）", "kind": "row", "id": "c178"}, {"sec": 13, "sub": "★ 空家等の特例（令和6年7月1日施行）", "front": "共通要件", "back": "<b>媒介契約の締結</b>に際し、あらかじめ<b>その依頼者に説明して合意</b>すること。買主から33万円を受けるには、<b>買主も依頼者</b>で、<b>買主自身への説明・合意</b>が必要", "kind": "row", "id": "c179"}, {"sec": 13, "sub": "★ 空家等の特例（令和6年7月1日施行）", "front": "代理のとき", "back": "33万円の<b>2倍</b>（66万円）が上限。相手方からも受けるなら合計66万円以内", "kind": "row", "id": "c180"}, {"sec": 14, "sub": "", "front": "登録の移転", "back": "他県の事務所に従事し（しようとし）たとき<b>任意</b>で申請。今の知事を<b>経由</b>して移転先の知事へ。<b>事務禁止期間中はできない</b>", "kind": "row", "id": "c181"}, {"sec": 14, "sub": "", "front": "変更の登録", "back": "氏名・住所・本籍・<b>勤務先の商号と免許証番号</b>が変わったとき、遅滞なく", "kind": "row", "id": "c182"}, {"sec": 14, "sub": "", "front": "宅建士証の書換え交付", "back": "<b>氏名・住所</b>が変わったときだけ（<b>勤務先の変更では不要</b>）", "kind": "row", "id": "c183"}, {"sec": 14, "sub": "", "front": "宅建士証の返納", "back": "登録の消除・宅建士証の失効のとき、<b>速やかに</b>交付した知事へ", "kind": "row", "id": "c184"}, {"sec": 14, "sub": "", "front": "宅建士証の提出", "back": "<b>事務禁止処分</b>を受けたとき、速やかに交付した知事へ（期間満了後に請求すれば返還）", "kind": "row", "id": "c185"}, {"sec": 14, "sub": "", "front": "提示義務", "back": "重要事項の説明のときは<b>請求がなくても</b>／取引の関係者から<b>請求があったとき</b>", "kind": "row", "id": "c186"}, {"sec": 14, "sub": "", "front": "10万円以下の過料", "back": "返納・提出・<b>重説時の提示</b>の義務違反。<b>罰金ではない</b>。対象は<b>宅建士個人のみ</b>で、業者は対象外", "kind": "row", "id": "c187"}, {"sec": 14, "sub": "", "front": "登録先", "back": "<b>試験を受けた都道府県</b>の知事（勤務先の所在地ではない）", "kind": "row", "id": "c188"}, {"sec": 14, "sub": "", "front": "登録の消除処分", "back": "宅建士証がないのに重説などを行ったとき、消除されるのは<b>情状が特に重い</b>場合。「情状のいかんを問わず」ではない", "kind": "row", "id": "c189"}, {"sec": 14, "sub": "", "front": "宅建士証の有効期間と更新", "back": "<b>5年</b>。更新には<b>法定講習</b>（交付申請前6か月以内）。免許のような「<b>90日前〜30日前</b>」という申請期間の規定は<b>ない</b>", "kind": "row", "id": "c190"}, {"sec": 14, "sub": "", "front": "旧姓・住所欄", "back": "旧姓を併記した宅建士証の交付を受けた日以降は、記名等に<b>旧姓を使える</b>。提示のとき住所欄に<b>シールを貼ってよい</b>", "kind": "row", "id": "c191"}, {"sec": 14, "sub": "", "front": "相手方が宅建業者のとき", "back": "重要事項の<b>説明は不要</b>（書面の交付だけ）。宅建士証の提示も<b>請求がなければ不要</b>", "kind": "row", "id": "c192"}, {"sec": 15, "sub": "", "front": "義務を負う者", "back": "<b>自ら売主</b>となる宅建業者だけ（媒介・代理は負わない）。<b>買主が宅建業者なら不要</b>", "kind": "row", "id": "c193"}, {"sec": 15, "sub": "", "front": "新築住宅とは", "back": "<b>人の居住用</b>で、完成から<b>1年以内</b>かつ未入居のもの（事務所・店舗は対象外）", "kind": "row", "id": "c194"}, {"sec": 15, "sub": "", "front": "資力確保措置", "back": "保証金の<b>供託</b>、または瑕疵担保責任<b>保険</b>契約（期間<b>10年以上</b>）の締結", "kind": "row", "id": "c195"}, {"sec": 15, "sub": "", "front": "保証金の供託先", "back": "<b>主たる事務所の最寄り</b>の供託所", "kind": "row", "id": "c196"}, {"sec": 15, "sub": "", "front": "供託所の所在地等の説明", "back": "<b>売買契約を締結するまで</b>に、書面を交付して説明（引渡しまでではない）", "kind": "row", "id": "c197"}, {"sec": 15, "sub": "", "front": "届出", "back": "基準日（<b>3月31日</b>）から<b>3週間</b>以内に<b>免許権者</b>へ（国交大臣ではない）", "kind": "row", "id": "c198"}, {"sec": 15, "sub": "", "front": "届出をしないと", "back": "基準日の翌日から<b>50日</b>経過後は、新たに自ら売主となる新築住宅の売買契約を結べない", "kind": "row", "id": "c199"}, {"sec": 15, "sub": "", "front": "保証金の額の計算", "back": "戸数で決まる。床面積 <b>55㎡以下</b>の住宅は<b>2戸で1戸</b>と数える", "kind": "row", "id": "c200"}, {"sec": 15, "sub": "", "front": "保険の対象", "back": "<b>構造耐力上主要な部分</b>と<b>雨水の浸入を防止する部分</b>の瑕疵（この2つ）", "kind": "row", "id": "c201"}, {"sec": 15, "sub": "", "front": "保険期間の短縮", "back": "<b>10年以上</b>が必要で、買主の承諾があっても<b>短縮できない</b>", "kind": "row", "id": "c202"}, {"sec": 16, "sub": "", "front": "<b>8つを挙げる</b>", "back": "① クーリング・オフ ② 自己の所有に属しない物件の契約締結の制限 ③ 損害賠償額の予定等の制限 ④ 手付の額の制限等 ⑤ 担保責任の特約の制限 ⑥ 手付金等の保全措置 ⑦ 割賦販売契約の解除等の制限 ⑧ 所有権留保等の禁止", "kind": "row", "id": "c203"}, {"sec": 16, "sub": "", "front": "適用されない場合", "back": "<b>買主が宅建業者</b>のとき（＝業者間取引）。33条の2および37条の2〜43条が<b>8つとも外れる</b>", "kind": "row", "id": "c204"}, {"sec": 16, "sub": "", "front": "手付の額の上限・性質", "back": "代金の <b>20%</b>。常に <b>解約手付</b>とみなす。買主に不利な特約は無効", "kind": "row", "id": "c205"}, {"sec": 16, "sub": "", "front": "損害賠償額の予定等", "back": "違約金と<b>合算</b>して代金の <b>20%</b>。<b>超える部分のみ無効</b>", "kind": "row", "id": "c206"}, {"sec": 16, "sub": "", "front": "契約不適合の通知期間", "back": "<b>引渡しの日から2年以上</b>とする特約は有効。それ以外で民法より不利なものは無効 → <b>民法に戻る（知った時から1年）</b>", "kind": "row", "id": "c207"}, {"sec": 16, "sub": "", "front": "未完成物件の保全", "back": "代金の <b>5%超</b> または <b>1,000万円超</b>", "kind": "row", "id": "c208"}, {"sec": 16, "sub": "", "front": "完成物件の保全", "back": "代金の <b>10%超</b> または <b>1,000万円超</b>", "kind": "row", "id": "c209"}, {"sec": 16, "sub": "", "front": "保全措置の方法（3つ）", "back": "① 銀行等の<b>保証委託</b>契約 ② 保険会社の<b>保証保険</b>契約 ③ 指定保管機関の<b>手付金等寄託</b>契約（<b>完成物件のみ</b>）", "kind": "row", "id": "c210"}, {"sec": 16, "sub": "", "front": "他人物売買", "back": "原則禁止。<b>取得する契約（予約を含み、停止条件付きを除く）</b>を締結していれば可", "kind": "row", "id": "c211"}, {"sec": 16, "sub": "", "front": "割賦販売の解除等", "back": "<b>30日以上</b>の相当の期間を定めて<b>書面で催告</b>", "kind": "row", "id": "c212"}, {"sec": 16, "sub": "", "front": "所有権留保等の禁止", "back": "代金の <b>30%</b>を超える支払を受けるまでに登記を移転する", "kind": "row", "id": "c213"}, {"sec": 16, "sub": "", "front": "クーリング・オフができなくなるとき", "back": "書面で告げられた日から <b>8日</b>経過／<b>引渡しを受け、かつ代金全額を支払った</b>とき（片方だけならまだできる）", "kind": "row", "id": "c214"}, {"sec": 16, "sub": "", "front": "できるかどうかの判定", "back": "<b>買主が申込みをした場所</b>で決まる（契約した場所ではない）。事務所、<b>土地に定着</b>した案内所（宅建士を置くべきもの）、<b>買主が自ら申し出た</b>自宅・勤務先での申込みは不可。テント張りの案内所なら可", "kind": "row", "id": "c215"}, {"sec": 16, "sub": "", "front": "方法と効力", "back": "<b>書面</b>で行う（口頭は不可）。書面を<b>発した時</b>に効力が生じる", "kind": "row", "id": "c216"}, {"sec": 16, "sub": "", "front": "効果", "back": "業者は受領した手付金等を<b>速やかに返還</b>する。損害賠償・違約金は請求できない。買主に不利な特約は無効", "kind": "row", "id": "c217"}, {"sec": 16, "sub": "", "front": "保全の要否の判定", "back": "手付金等の合計が限度額を超えたら<b>全額</b>について講じる（超える部分だけではない）。買主が<b>登記</b>を得た後は不要。保全しても手付は代金の <b>2割</b>を超えて受け取れない", "kind": "row", "id": "c218"}, {"sec": 17, "sub": "", "front": "普通決議（定足数・★ 多数決要件（母数））", "back": "<span class=\"k\">定足数：</span>なし<br><span class=\"k\">★ 多数決要件（母数）：</span><b>出席者</b>及び出席議決権の各<b>過半数</b>", "kind": "row", "id": "c219"}, {"sec": 17, "sub": "", "front": "規約の設定・変更・廃止（定足数・★ 多数決要件（母数））", "back": "<span class=\"k\">定足数：</span>各過半数の出席<br><span class=\"k\">★ 多数決要件（母数）：</span><b>出席者</b>の各<b>4分の3</b>以上", "kind": "row", "id": "c220"}, {"sec": 17, "sub": "", "front": "共用部分の重大変更（定足数・★ 多数決要件（母数））", "back": "<span class=\"k\">定足数：</span>各過半数の出席<br><span class=\"k\">★ 多数決要件（母数）：</span><b>出席者</b>の各<b>4分の3</b>以上", "kind": "row", "id": "c221"}, {"sec": 17, "sub": "", "front": "管理組合法人の設立・解散（定足数・★ 多数決要件（母数））", "back": "<span class=\"k\">定足数：</span>各過半数の出席<br><span class=\"k\">★ 多数決要件（母数）：</span><b>出席者</b>の各<b>4分の3</b>以上", "kind": "row", "id": "c222"}, {"sec": 17, "sub": "", "front": "義務違反者への使用禁止・競売・引渡し請求（58〜60条）（定足数・★ 多数決要件（母数））", "back": "<span class=\"k\">定足数：</span>各過半数の出席<br><span class=\"k\">★ 多数決要件（母数）：</span><b>出席者</b>の各<b>4分の3</b>以上", "kind": "row", "id": "c223"}, {"sec": 17, "sub": "", "front": "大規模滅失の復旧（定足数・★ 多数決要件（母数））", "back": "<span class=\"k\">定足数：</span>各過半数の出席<br><span class=\"k\">★ 多数決要件（母数）：</span><b>出席者</b>の各<b>3分の2</b>以上", "kind": "row", "id": "c224"}, {"sec": 17, "sub": "", "front": "建替え決議（定足数・★ 多数決要件（母数））", "back": "<span class=\"k\">定足数：</span>なし<br><span class=\"k\">★ 多数決要件（母数）：</span>各<b>5分の4</b>以上（<b>母数は総数</b>。5要件該当時は4分の3）", "kind": "row", "id": "c225"}, {"sec": 17, "sub": "", "front": "共用部分の持分の処分", "back": "専有部分の処分に従い、<b>別段の定めがある場合を除き分離して処分できない</b>（15条2項）。敷地利用権も同じ", "kind": "row", "id": "c226"}, {"sec": 17, "sub": "", "front": "管理組合法人の理事・監事の任期", "back": "原則 <b>2年</b>。規約で <b>3年以内</b>の別段の期間を定められる", "kind": "row", "id": "c227"}, {"sec": 17, "sub": "", "front": "規約・集会の決議の効力が及ぶ者", "back": "<b>特定承継人</b>にも及ぶ（46条1項）。占有者は<b>使用方法</b>についてのみ従う", "kind": "row", "id": "c228"}, {"sec": 17, "sub": "", "front": "規約の閲覧を拒めるか", "back": "<b>正当な理由があれば拒める</b>（33条2項）", "kind": "row", "id": "c229"}, {"sec": 17, "sub": "", "front": "行為の停止等の請求（57条）で訴えを起こすとき", "back": "<b>普通決議</b>（出席者の各過半数）で足りる。4分の3が要るのは58〜60条だけ", "kind": "row", "id": "c230"}, {"sec": 17, "sub": "", "front": "共用部分の持分の割合", "back": "<b>専有部分の床面積</b>の割合（規約で別段の定め可）。共有者の数で等分ではない", "kind": "row", "id": "c231"}, {"sec": 17, "sub": "", "front": "保存行為", "back": "<b>各共有者が単独</b>でできる（規約で別段の定め可）。集会の決議は要らない", "kind": "row", "id": "c232"}, {"sec": 17, "sub": "", "front": "小規模滅失（価格の2分の1以下）の復旧", "back": "各区分所有者が<b>単独で</b>復旧できる。ただし復旧決議・建替え決議等があれば単独ではできない", "kind": "row", "id": "c233"}, {"sec": 17, "sub": "", "front": "規約の保管", "back": "<b>管理者</b>が保管する。管理者がいなければ、建物を使用している区分所有者またはその代理人で<b>規約または集会の決議で定める者</b>。保管場所は建物内に掲示", "kind": "row", "id": "c234"}, {"sec": 17, "sub": "", "front": "集会の招集", "back": "管理者が<b>少なくとも毎年1回</b>招集。区分所有者の<b>5分の1</b>以上で議決権の<b>5分の1</b>以上を有する者は招集を請求できる（この定数は規約で<b>減らせる</b>）", "kind": "row", "id": "c235"}, {"sec": 17, "sub": "", "front": "招集の通知", "back": "会日の<b>1週間前</b>まで（規約で伸縮できる）。区分所有者<b>全員の同意</b>があれば招集手続を省略できる", "kind": "row", "id": "c236"}, {"sec": 17, "sub": "", "front": "集会で決議できる事項", "back": "原則として<b>通知した事項だけ</b>。規約で別段の定めをすれば通知事項以外も決議できる（特別決議事項を除く）", "kind": "row", "id": "c237"}, {"sec": 17, "sub": "", "front": "管理者の事務報告", "back": "集会で<b>毎年1回</b>一定の時期に報告する", "kind": "row", "id": "c238"}, {"sec": 17, "sub": "", "front": "一部共用部分に関する規約", "back": "全員の規約で定められるが、当該部分を共用する区分所有者の<b>4分の1を超える</b>者（または議決権の4分の1超）が反対すると定められない", "kind": "row", "id": "c239"}, {"sec": 17, "sub": "", "front": "★ 母数が「総数」のままなのはどれか", "back": "<b>建替え決議</b>と、新設された建物更新・建物敷地売却・建物取壊し等の<b>5分の4決議</b>。それ以外はすべて<b>出席者</b>が母数", "kind": "row", "id": "c240"}, {"sec": 18, "sub": "注意義務", "front": "善良な管理者の注意（善管注意）", "back": "受任者（<b>無報酬でも</b>）／<b>有償</b>の受寄者／使用借主／賃借人／留置権者／質権者", "kind": "row", "id": "c241"}, {"sec": 18, "sub": "注意義務", "front": "自己の財産に対するのと同一の注意", "back": "<b>無報酬の受寄者</b>だけ（民法の契約ではここだけ）", "kind": "row", "id": "c242"}, {"sec": 18, "sub": "委任", "front": "報酬", "back": "特約がなければ<b>請求できない</b>。<b>後払い</b>（事務を履行した後。期間で定めたら期間経過後）", "kind": "row", "id": "c243"}, {"sec": 18, "sub": "委任", "front": "途中で履行できなくなったとき", "back": "委任者の責めに帰することができない事由で履行できなくなったとき・中途で終わったときは、<b>既にした履行の割合</b>で報酬を請求できる（<b>受任者に落度があっても</b>）", "kind": "row", "id": "c244"}, {"sec": 18, "sub": "委任", "front": "費用", "back": "<b>前払い</b>を請求できる。支出した費用と利息の償還も請求できる", "kind": "row", "id": "c245"}, {"sec": 18, "sub": "委任", "front": "解除", "back": "各当事者が<b>いつでも</b>解除できる。相手方に不利な時期の解除や、受任者の利益（報酬を除く）をも目的とする委任の解除は<b>損害賠償</b>が要る（やむを得ない事由があれば不要）", "kind": "row", "id": "c246"}, {"sec": 18, "sub": "委任", "front": "終了事由", "back": "委任者の<b>死亡・破産</b>／受任者の<b>死亡・破産・後見開始</b>。委任者の後見開始では<b>終わらない</b>", "kind": "row", "id": "c247"}, {"sec": 18, "sub": "委任", "front": "終了した後", "back": "<b>急迫の事情があるとき</b>は、受任者等は委任者の相続人等が処理できるまで必要な処分をする（なければ不要）", "kind": "row", "id": "c248"}, {"sec": 18, "sub": "委任", "front": "復委任", "back": "委任者の<b>許諾</b>があるとき、または<b>やむを得ない事由</b>があるときだけ", "kind": "row", "id": "c249"}, {"sec": 18, "sub": "請負", "front": "報酬の支払時期", "back": "目的物の<b>引渡しと同時</b>（引渡しが要らない仕事なら完成後）", "kind": "row", "id": "c250"}, {"sec": 18, "sub": "請負", "front": "完成できなかったとき", "back": "注文者の責めに帰することができない事由で完成できなくなったとき・完成前に解除されたときも、<b>可分な部分</b>で注文者が利益を受けていれば、その<b>割合</b>で報酬を請求できる", "kind": "row", "id": "c251"}, {"sec": 18, "sub": "請負", "front": "注文者からの解除", "back": "仕事の<b>完成前</b>なら、いつでも<b>損害を賠償して</b>解除できる", "kind": "row", "id": "c252"}, {"sec": 18, "sub": "請負", "front": "注文者の破産", "back": "<b>請負人</b>または破産管財人が解除できる（請負人からは仕事の完成前に限る）", "kind": "row", "id": "c253"}, {"sec": 18, "sub": "請負", "front": "契約不適合", "back": "売買と同じく追完・減額・損害賠償・解除ができる（<b>建物でも解除できる</b>）。注文者の<b>材料</b>や<b>指図</b>による不適合は追及できない（請負人が不適当と知りながら告げなかったときは別）。知った時から<b>1年以内</b>に通知（請負人が悪意・重過失なら不要）", "kind": "row", "id": "c254"}, {"sec": 18, "sub": "寄託・事務管理", "front": "寄託物の返還", "back": "寄託者は<b>いつでも</b>返還を請求できる。受寄者は、返還時期の定めがなければいつでも返還できる", "kind": "row", "id": "c255"}, {"sec": 18, "sub": "寄託・事務管理", "front": "事務管理", "back": "本人の意思に従い、最も本人の利益に適合する方法で管理する。有益な費用は償還を請求できるが、<b>報酬は請求できない</b>。本人の身体・名誉・財産への急迫の危害を免れさせる管理なら、悪意・重過失がなければ損害賠償の責任を負わない", "kind": "row", "id": "c256"}, {"sec": 18, "sub": "使用貸借と賃貸借", "front": "使用貸借の成立", "back": "<b>合意だけ</b>で成立。書面によらない使用貸借は、借主が受け取るまで貸主が解除できる", "kind": "row", "id": "c257"}, {"sec": 18, "sub": "使用貸借と賃貸借", "front": "通常の必要費", "back": "使用貸借は<b>借主</b>が負担／賃貸借は<b>貸主</b>が負担し、賃借人は<b>直ちに</b>償還を請求できる（有益費は終了時に、価格の増加が残っていれば）", "kind": "row", "id": "c258"}, {"sec": 18, "sub": "使用貸借と賃貸借", "front": "当事者の死亡", "back": "使用貸借は<b>借主の死亡</b>で終わる（貸主の死亡では終わらない）／賃貸借は相続される", "kind": "row", "id": "c259"}, {"sec": 18, "sub": "使用貸借と賃貸借", "front": "使用貸借の終了", "back": "期間の定めがなく<b>目的の定めがある</b>ときは、目的に従った使用収益を終えたとき終わる。使用収益に<b>足りる期間</b>を過ぎれば、終えていなくても貸主が解除できる。期間も目的も定めがなければ貸主はいつでも解除できる。借主はいつでも解除できる", "kind": "row", "id": "c260"}, {"sec": 18, "sub": "使用貸借と賃貸借", "front": "第三者への対抗", "back": "使用借権は登記できず、<b>引渡しも対抗要件にならない</b>（対抗する手段がない）", "kind": "row", "id": "c261"}, {"sec": 19, "sub": "意思表示", "front": "心裡留保（当事者の間・第三者との関係）", "back": "<span class=\"k\">当事者の間：</span>原則<b>有効</b>。相手方が真意を知り、または知ることができたなら<b>無効</b><br><span class=\"k\">第三者との関係：</span>無効を<b>善意</b>の第三者に対抗できない", "kind": "row", "id": "c262"}, {"sec": 19, "sub": "意思表示", "front": "虚偽表示（当事者の間・第三者との関係）", "back": "<span class=\"k\">当事者の間：</span><b>無効</b><br><span class=\"k\">第三者との関係：</span><b>善意</b>の第三者に対抗できない（過失の有無・登記は問わない）", "kind": "row", "id": "c263"}, {"sec": 19, "sub": "意思表示", "front": "錯誤（当事者の間・第三者との関係）", "back": "<span class=\"k\">当事者の間：</span>重要な錯誤なら<b>取り消せる</b>（動機の錯誤は、その事情が表示されていたときだけ）。表意者に<b>重過失</b>があれば取り消せない（相手方が悪意・重過失、または同じ錯誤なら取り消せる）<br><span class=\"k\">第三者との関係：</span><b>善意・無過失</b>の第三者に対抗できない", "kind": "row", "id": "c264"}, {"sec": 19, "sub": "意思表示", "front": "詐欺（当事者の間・第三者との関係）", "back": "<span class=\"k\">当事者の間：</span><b>取り消せる</b>。第三者の詐欺は、相手方が悪意・有過失のときだけ取り消せる<br><span class=\"k\">第三者との関係：</span><b>善意・無過失</b>の第三者に対抗できない", "kind": "row", "id": "c265"}, {"sec": 19, "sub": "意思表示", "front": "強迫（当事者の間・第三者との関係）", "back": "<span class=\"k\">当事者の間：</span><b>取り消せる</b>（第三者の強迫でも）<br><span class=\"k\">第三者との関係：</span>善意・無過失の第三者にも<b>対抗できる</b>", "kind": "row", "id": "c266"}, {"sec": 19, "sub": "制限行為能力者", "front": "未成年者（18歳未満）", "back": "法定代理人の同意のない行為は取り消せる。単に権利を得る・義務を免れる行為、処分を許された財産、許可された営業は<b>単独で</b>できる", "kind": "row", "id": "c267"}, {"sec": 19, "sub": "制限行為能力者", "front": "成年被後見人", "back": "日用品の購入など日常生活の行為を除き取り消せる（<b>後見人の同意があっても</b>取り消せる）", "kind": "row", "id": "c268"}, {"sec": 19, "sub": "制限行為能力者", "front": "被保佐人", "back": "不動産の売買・借財・保証・新築・増改築など<b>重要な財産上の行為</b>は、保佐人の同意が必要", "kind": "row", "id": "c269"}, {"sec": 19, "sub": "制限行為能力者", "front": "被補助人", "back": "審判で定めた<b>特定の行為だけ</b>補助人の同意が必要（本人以外の請求で審判するには本人の同意が要る）", "kind": "row", "id": "c270"}, {"sec": 19, "sub": "制限行為能力者", "front": "成年後見人と居住用不動産", "back": "成年被後見人の居住用の建物・敷地を売却・賃貸・抵当権設定するには<b>家庭裁判所の許可</b>が必要", "kind": "row", "id": "c271"}, {"sec": 19, "sub": "制限行為能力者", "front": "取り消せなくなるとき", "back": "行為能力者だと信じさせるため<b>詐術</b>を用いたとき／追認できる時から<b>5年</b>、行為の時から<b>20年</b>", "kind": "row", "id": "c272"}, {"sec": 19, "sub": "制限行為能力者", "front": "相手方の催告", "back": "<b>1か月以上</b>の期間を定めて催告できる。能力者となった本人や法定代理人が確答しなければ<b>追認</b>とみなす（被保佐人・被補助人本人への催告なら<b>取消し</b>とみなす）", "kind": "row", "id": "c273"}, {"sec": 19, "sub": "制限行為能力者", "front": "年齢の決まり", "back": "遺言は<b>15歳</b>から（同意不要）／婚姻は<b>18歳</b>から（父母の同意不要）／養親は<b>20歳</b>以上／未成年者は遺言の<b>証人</b>になれない", "kind": "row", "id": "c274"}, {"sec": 19, "sub": "代理", "front": "無権代理の追認", "back": "本人が追認すれば<b>契約の時にさかのぼって</b>有効（第三者の権利は害せない）", "kind": "row", "id": "c275"}, {"sec": 19, "sub": "代理", "front": "相手方ができること", "back": "本人に<b>催告</b>できる（確答がなければ<b>追認拒絶</b>とみなす）／<b>善意</b>なら本人の追認前に<b>取り消せる</b>", "kind": "row", "id": "c276"}, {"sec": 19, "sub": "代理", "front": "無権代理人の責任", "back": "相手方は履行か損害賠償を請求できる。相手方が<b>悪意</b>なら不可。<b>有過失</b>でも、無権代理人が代理権がないと知っていれば可。無権代理人が制限行為能力者なら責任を負わない", "kind": "row", "id": "c277"}, {"sec": 19, "sub": "代理", "front": "表見代理", "back": "代理権授与の表示／権限外の行為／代理権消滅後。相手方が<b>善意・無過失</b>なら本人に効果が帰属する", "kind": "row", "id": "c278"}, {"sec": 19, "sub": "代理", "front": "無権代理と相続", "back": "無権代理人が本人を<b>単独</b>相続 → 追認拒絶<b>できない</b>／<b>共同</b>相続 → 他の相続人全員が追認しなければ、無権代理人の相続分も当然には有効にならない／<b>本人</b>が無権代理人を相続 → 追認拒絶<b>できる</b>（無権代理人の責任は相続する）／無権代理人を相続した後に本人も相続 → 追認拒絶<b>できない</b>", "kind": "row", "id": "c279"}, {"sec": 19, "sub": "代理", "front": "自己契約・双方代理", "back": "<b>無権代理</b>とみなす（本人があらかじめ許諾した行為、債務の履行は可）", "kind": "row", "id": "c280"}, {"sec": 19, "sub": "代理", "front": "代理人が制限行為能力者", "back": "代理人になれる。その行為は行為能力の制限を理由に<b>取り消せない</b>", "kind": "row", "id": "c281"}, {"sec": 20, "sub": "", "front": "履行遅滞になる時", "back": "確定期限 → 期限の到来時／不確定期限 → 期限到来後に<b>請求を受けた時</b>か、到来を<b>知った時</b>の早い方／期限の定めなし → <b>請求を受けた時</b>", "kind": "row", "id": "c282"}, {"sec": 20, "sub": "", "front": "金銭債務の特則", "back": "<b>不可抗力</b>でも遅滞の責任を負う／債権者は<b>損害の証明が不要</b>／遅延損害金は<b>法定利率（年3%）</b>（約定利率が高ければそれ）", "kind": "row", "id": "c283"}, {"sec": 20, "sub": "", "front": "過失相殺", "back": "債権者にも過失があれば、裁判所は<b>債務者の主張がなくても</b>考慮する（責任を免除することもできる）", "kind": "row", "id": "c284"}, {"sec": 20, "sub": "", "front": "催告による解除", "back": "相当の期間を定めて催告し、履行がなければ解除できる（不履行が<b>軽微</b>なら不可）。債務者の帰責事由は<b>要らない</b>", "kind": "row", "id": "c285"}, {"sec": 20, "sub": "", "front": "催告なしで解除できるとき", "back": "<b>履行不能</b>／全部の<b>履行を拒絶する意思を明確に表示</b>／定期行為で時期を過ぎた など", "kind": "row", "id": "c286"}, {"sec": 20, "sub": "", "front": "解除の効果", "back": "原状回復（金銭は受け取った時からの利息を付ける）。解除前の第三者は<b>登記</b>があれば保護される", "kind": "row", "id": "c287"}, {"sec": 20, "sub": "", "front": "解約手付", "back": "<b>相手方</b>が履行に着手するまで、買主は手付を放棄、売主は<b>倍額を現実に提供</b>して解除できる（自分が着手していても、相手方が未着手なら解除できる）", "kind": "row", "id": "c288"}, {"sec": 20, "sub": "", "front": "契約不適合で買主ができること", "back": "追完請求・代金減額請求・損害賠償請求・解除。<b>損害賠償だけ</b>は売主の帰責事由が要る。不適合が<b>買主</b>の責めに帰すべき事由によるときは、追完・減額・解除もできない", "kind": "row", "id": "c289"}, {"sec": 20, "sub": "", "front": "種類・品質の不適合の通知", "back": "知った時から<b>1年以内</b>に通知しないと追及できない。売主が引渡し時に<b>悪意・重過失</b>なら期間の制限はない。数量・権利の不適合にはこの通知期間はない", "kind": "row", "id": "c290"}, {"sec": 20, "sub": "", "front": "担保責任を負わない特約", "back": "有効。ただし売主が<b>知りながら告げなかった</b>事実などは責任を免れない", "kind": "row", "id": "c291"}, {"sec": 20, "sub": "", "front": "引渡し後の滅失・損傷", "back": "当事者双方の責めに帰することができない事由なら、買主は追完・減額・損害賠償・解除が<b>できず</b>、代金の支払も拒めない", "kind": "row", "id": "c292"}, {"sec": 21, "sub": "保証", "front": "成立", "back": "<b>書面</b>（または電磁的記録）でしなければ効力を生じない（単なる保証も根保証も）", "kind": "row", "id": "c293"}, {"sec": 21, "sub": "保証", "front": "付従性", "back": "主債務が消えれば保証債務も消える。主債務者への時効の完成猶予・更新は保証人にも及ぶ", "kind": "row", "id": "c294"}, {"sec": 21, "sub": "保証", "front": "催告・検索の抗弁権", "back": "普通の保証人には<b>ある</b>（主債務者に弁済の資力があり、執行が容易なことを証明）。<b>連帯保証人にはない</b>", "kind": "row", "id": "c295"}, {"sec": 21, "sub": "保証", "front": "主債務の時効", "back": "保証人は主債務の消滅時効を<b>援用できる</b>", "kind": "row", "id": "c296"}, {"sec": 21, "sub": "保証", "front": "連帯保証人に生じた事由", "back": "弁済・相殺・更改・混同は主債務者にも及ぶ。<b>履行の請求</b>は及ばない", "kind": "row", "id": "c297"}, {"sec": 21, "sub": "保証", "front": "個人の根保証", "back": "<b>極度額</b>を定めなければ効力を生じない（賃借人の債務の保証も含む）。法人の根保証は不要", "kind": "row", "id": "c298"}, {"sec": 21, "sub": "保証", "front": "事業用の貸金債務の個人保証", "back": "契約前<b>1か月以内</b>に<b>公正証書</b>で保証意思を表示しなければ無効（主債務者の経営者や<b>共同事業者</b>などは不要）", "kind": "row", "id": "c299"}, {"sec": 21, "sub": "連帯債務", "front": "他の連帯債務者にも及ぶ事由", "back": "<b>弁済・相殺・更改・混同</b>の4つ", "kind": "row", "id": "c300"}, {"sec": 21, "sub": "連帯債務", "front": "及ばない事由", "back": "<b>履行の請求</b>・<b>免除</b>・<b>時効の完成</b>・承認など（別段の合意があれば及ぶ）", "kind": "row", "id": "c301"}, {"sec": 21, "sub": "連帯債務", "front": "反対債権を持つ者が相殺しないとき", "back": "その者の<b>負担部分の限度</b>で、他の連帯債務者は履行を<b>拒める</b>", "kind": "row", "id": "c302"}, {"sec": 21, "sub": "連帯債務", "front": "求償", "back": "弁済した者は、自分の負担部分を超えなくても、他の者に負担部分の割合で求償できる", "kind": "row", "id": "c303"}, {"sec": 21, "sub": "連帯債務", "front": "共同不法行為", "back": "加害者は<b>連帯債務</b>を負う。1人への請求は他の加害者に<b>効力を生じない</b>", "kind": "row", "id": "c304"}, {"sec": 22, "sub": "時効", "front": "取得時効", "back": "所有の意思をもって平穏・公然に占有。占有開始時に<b>善意・無過失なら10年</b>、そうでなければ<b>20年</b>。前の占有者の期間を<b>併せて</b>主張できる（善意・無過失は前主の占有開始時で判断）", "kind": "row", "id": "c305"}, {"sec": 22, "sub": "時効", "front": "債権の消滅時効", "back": "権利を行使できることを<b>知った時から5年</b>、行使できる時から<b>10年</b>（人の生命・身体の侵害は20年）", "kind": "row", "id": "c306"}, {"sec": 22, "sub": "時効", "front": "不法行為の損害賠償", "back": "損害と加害者を<b>知った時から3年</b>（生命・身体は5年）、不法行為の時から<b>20年</b>。「知った時」は<b>現実に認識した時</b>。日々発生する損害は、各損害を知った時から<b>別々に</b>進む", "kind": "row", "id": "c307"}, {"sec": 22, "sub": "時効", "front": "完成猶予と更新", "back": "裁判上の請求 → 終わるまで猶予、確定判決で<b>更新</b>（新たに10年）／<b>催告</b> → 6か月の猶予だけ（猶予中の再度の催告は効力なし）／協議を行う旨の書面の合意 → 1年の猶予／<b>承認</b> → 更新", "kind": "row", "id": "c308"}, {"sec": 22, "sub": "時効", "front": "時効の利益", "back": "完成前に放棄できない。完成後に<b>承認</b>したら、知らなくても援用できない（判例）", "kind": "row", "id": "c309"}, {"sec": 22, "sub": "時効", "front": "援用できる者", "back": "保証人・物上保証人・抵当不動産の<b>第三取得者</b>（後順位抵当権者は援用できない）", "kind": "row", "id": "c310"}, {"sec": 22, "sub": "物権変動：登記がなければ対抗できないか", "front": "二重譲渡", "back": "先に<b>登記</b>した方が勝つ（先に契約した方ではない）", "kind": "row", "id": "c311"}, {"sec": 22, "sub": "物権変動：登記がなければ対抗できないか", "front": "取消しと第三者", "back": "詐欺による取消し<b>前</b>の善意・無過失の第三者は保護される（登記不要）。取消し<b>後</b>の第三者とは<b>登記の先後</b>", "kind": "row", "id": "c312"}, {"sec": 22, "sub": "物権変動：登記がなければ対抗できないか", "front": "解除と第三者", "back": "解除<b>前</b>の第三者は<b>登記</b>があれば保護される。解除<b>後</b>の第三者とは登記の先後", "kind": "row", "id": "c313"}, {"sec": 22, "sub": "物権変動：登記がなければ対抗できないか", "front": "時効取得と第三者", "back": "時効<b>完成前</b>の第三者には登記なしで対抗できる。<b>完成後</b>の第三者とは登記の先後", "kind": "row", "id": "c314"}, {"sec": 22, "sub": "物権変動：登記がなければ対抗できないか", "front": "相続と登記", "back": "法定相続分までは登記なしで対抗できる。<b>超える部分</b>（遺産分割・遺言で得た分）は登記がなければ対抗できない", "kind": "row", "id": "c315"}, {"sec": 22, "sub": "物権変動：登記がなければ対抗できないか", "front": "登記なしで対抗できる相手", "back": "<b>不法占拠者</b>・無権利者・<b>背信的悪意者</b>（背信的悪意者から買った者でも、自分が背信的悪意者でなければ登記を得て保護される）", "kind": "row", "id": "c316"}, {"sec": 22, "sub": "物権変動：登記がなければ対抗できないか", "front": "賃料を請求する新所有者", "back": "賃借人に対抗するには<b>所有権移転登記</b>が必要", "kind": "row", "id": "c317"}, {"sec": 23, "sub": "共有（令和5年4月施行の改正後）", "front": "保存行為", "back": "各共有者が<b>単独で</b>できる（不法占拠者への明渡し請求など）", "kind": "row", "id": "c318"}, {"sec": 23, "sub": "共有（令和5年4月施行の改正後）", "front": "管理行為", "back": "持分の価格の<b>過半数</b>で決める（賃貸借の締結・解除など）。短期の賃借権（土地<b>5年</b>・建物<b>3年</b>以内）の設定も過半数", "kind": "row", "id": "c319"}, {"sec": 23, "sub": "共有（令和5年4月施行の改正後）", "front": "軽微な変更", "back": "形状・効用の著しい変更を伴わないものは持分の価格の<b>過半数</b>", "kind": "row", "id": "c320"}, {"sec": 23, "sub": "共有（令和5年4月施行の改正後）", "front": "変更", "back": "<b>共有者全員</b>の同意（売却・建替え・長期の賃貸など）", "kind": "row", "id": "c321"}, {"sec": 23, "sub": "共有（令和5年4月施行の改正後）", "front": "共有物の使用", "back": "各共有者は<b>持分に応じて</b>全部を使える。使う共有者は、別段の合意がなければ他の共有者に<b>使用の対価</b>を支払う", "kind": "row", "id": "c322"}, {"sec": 23, "sub": "共有（令和5年4月施行の改正後）", "front": "持分の処分", "back": "各共有者が<b>自由に</b>できる（他の共有者の同意は要らない）", "kind": "row", "id": "c323"}, {"sec": 23, "sub": "共有（令和5年4月施行の改正後）", "front": "持分の放棄・相続人なしの死亡", "back": "その持分は<b>他の共有者</b>に帰属する（特別縁故者への分与が先）", "kind": "row", "id": "c324"}, {"sec": 23, "sub": "共有（令和5年4月施行の改正後）", "front": "分割", "back": "いつでも請求できる。分割しない特約は<b>5年以内</b>（更新も5年以内）", "kind": "row", "id": "c325"}, {"sec": 23, "sub": "抵当権", "front": "物上代位", "back": "賃料・保険金・売買代金などにも及ぶ。ただし<b>払渡し前に差押え</b>が必要", "kind": "row", "id": "c326"}, {"sec": 23, "sub": "抵当権", "front": "利息の範囲", "back": "後順位抵当権者などがいれば、満期となった<b>最後の2年分</b>だけ（根抵当権は極度額まで全部）", "kind": "row", "id": "c327"}, {"sec": 23, "sub": "抵当権", "front": "法定地上権", "back": "抵当権設定時に<b>土地の上に建物</b>があり、<b>同じ所有者</b>で、競売の結果別々の所有者になったときに成立。更地に設定した後に建てた建物には成立しない（土地と建物の<b>一括競売</b>はできる）", "kind": "row", "id": "c328"}, {"sec": 23, "sub": "抵当権", "front": "抵当権に後れる賃借人", "back": "抵当権者に対抗できない。ただし<b>建物</b>の賃借人は、買受人が買い受けた時から<b>6か月</b>は明渡しが猶予される", "kind": "row", "id": "c329"}, {"sec": 23, "sub": "抵当権", "front": "抵当権消滅請求", "back": "<b>第三取得者</b>が、競売による差押えの効力が生じる前に請求できる（主たる債務者・保証人はできない）", "kind": "row", "id": "c330"}, {"sec": 23, "sub": "抵当権", "front": "順位の放棄", "back": "放棄した者と受けた者は<b>同順位</b>になり、2人の配当の合計を債権額の割合で分ける", "kind": "row", "id": "c331"}, {"sec": 24, "sub": "", "front": "配偶者＋子（配偶者・もう一方）", "back": "<span class=\"k\">配偶者：</span>1/2<br><span class=\"k\">もう一方：</span>1/2（子の頭数で等分）", "kind": "row", "id": "c332"}, {"sec": 24, "sub": "", "front": "配偶者＋直系尊属（配偶者・もう一方）", "back": "<span class=\"k\">配偶者：</span><b>2/3</b><br><span class=\"k\">もう一方：</span><b>1/3</b>", "kind": "row", "id": "c333"}, {"sec": 24, "sub": "", "front": "配偶者＋兄弟姉妹（配偶者・もう一方）", "back": "<span class=\"k\">配偶者：</span><b>3/4</b><br><span class=\"k\">もう一方：</span><b>1/4</b>", "kind": "row", "id": "c334"}, {"sec": 24, "sub": "", "front": "代襲相続人の相続分", "back": "<b>被代襲者が受けるはずだった相続分をそのまま承継</b>", "kind": "row", "id": "c335"}, {"sec": 24, "sub": "", "front": "代襲原因になるもの（3つ）", "back": "<b>死亡・欠格・廃除</b>", "kind": "row", "id": "c336"}, {"sec": 24, "sub": "", "front": "代襲原因に<b>ならない</b>もの", "back": "<b>相続放棄</b>（放棄した本人の子も代襲できない）", "kind": "row", "id": "c337"}, {"sec": 24, "sub": "", "front": "内縁の配偶者", "back": "<b>相続人にならない</b>", "kind": "row", "id": "c338"}, {"sec": 24, "sub": "", "front": "婚姻前に縁組した養子", "back": "<b>相続人になる</b>（縁組の時期は無関係）", "kind": "row", "id": "c339"}, {"sec": 24, "sub": "", "front": "代襲の範囲", "back": "子は<b>再代襲あり</b>／兄弟姉妹は<b>1代限り</b>（甥・姪まで）", "kind": "row", "id": "c340"}, {"sec": 24, "sub": "", "front": "半血の兄弟姉妹", "back": "全血の兄弟姉妹の <b>2分の1</b>", "kind": "row", "id": "c341"}, {"sec": 24, "sub": "", "front": "遺留分の割合", "back": "直系尊属<b>のみ</b>が相続人なら<b>3分の1</b>、それ以外は<b>2分の1</b>。<b>兄弟姉妹には遺留分がない</b>", "kind": "row", "id": "c342"}, {"sec": 24, "sub": "", "front": "遺留分侵害額の請求", "back": "知った時から<b>1年</b>、相続開始から<b>10年</b>", "kind": "row", "id": "c343"}, {"sec": 24, "sub": "", "front": "相続開始前の遺留分の放棄", "back": "<b>家庭裁判所の許可</b>が必要（相続放棄は開始前にはできない）", "kind": "row", "id": "c344"}, {"sec": 24, "sub": "", "front": "承認・放棄の期間", "back": "相続の開始を<b>知った時から3か月以内</b>。何もしなければ<b>単純承認</b>", "kind": "row", "id": "c345"}, {"sec": 24, "sub": "", "front": "限定承認と放棄", "back": "限定承認は共同相続人<b>全員が共同して</b>、放棄は<b>各自が単独で</b>、家庭裁判所に申述する", "kind": "row", "id": "c346"}, {"sec": 24, "sub": "", "front": "遺言", "back": "<b>15歳</b>以上ならできる。いつでも<b>撤回</b>でき、前の遺言と抵触する部分は撤回したとみなす。公正証書遺言は証人<b>2人以上</b>", "kind": "row", "id": "c347"}, {"sec": 24, "sub": "", "front": "配偶者居住権", "back": "相続開始時に被相続人の建物に住んでいた配偶者が、遺産分割・遺贈などで取得する。存続期間は原則<b>終身</b>。<b>登記</b>すれば第三者に対抗できる。<b>譲渡できない</b>", "kind": "row", "id": "c348"}, {"sec": 25, "sub": "印紙税", "front": "課税される文書", "back": "不動産の売買・交換の契約書／地上権・<b>土地</b>の賃借権の設定・譲渡の契約書／請負の契約書／金銭の受取書（<b>5万円以上</b>。営業に関しないものは非課税）", "kind": "row", "id": "c349"}, {"sec": 25, "sub": "印紙税", "front": "課税されない文書", "back": "<b>建物の賃貸借</b>の契約書／使用貸借／抵当権設定の契約書／委任状／国・地方公共団体が作成した文書", "kind": "row", "id": "c350"}, {"sec": 25, "sub": "印紙税", "front": "国等と私人が共同で作成した文書", "back": "<b>私人が保存する方</b>は国等が作成したものとみなして<b>非課税</b>。国等が保存する方は課税", "kind": "row", "id": "c351"}, {"sec": 25, "sub": "印紙税", "front": "記載金額", "back": "交換は<b>高い方</b>の金額（交換差金だけの記載ならその額）／土地賃借権の設定は<b>権利金</b>など返還されない金額（賃料・敷金は含めない）／増額の変更契約は<b>増加額</b>だけ／減額の変更契約や贈与は<b>記載金額なし</b>（200円）／消費税額が区分して書かれていれば含めない", "kind": "row", "id": "c352"}, {"sec": 25, "sub": "印紙税", "front": "納税義務者", "back": "文書の<b>作成者</b>（共同で作成したら連帯して納付）。2通作ればそれぞれ課税。写しも契約の成立を証明するなら課税", "kind": "row", "id": "c353"}, {"sec": 25, "sub": "印紙税", "front": "貼らなかったとき", "back": "<b>過怠税</b>：納付しなかった税額とその<b>2倍</b>（合計3倍）。自ら申し出れば1.1倍。消印しなかったら、その印紙の額", "kind": "row", "id": "c354"}, {"sec": 25, "sub": "譲渡所得（居住用財産の特例）", "front": "長期と短期", "back": "譲渡した年の<b>1月1日</b>で所有期間<b>5年超</b>なら長期", "kind": "row", "id": "c355"}, {"sec": 25, "sub": "譲渡所得（居住用財産の特例）", "front": "3,000万円の特別控除", "back": "所有期間を<b>問わない</b>（短期でも可）。配偶者・直系血族・生計を一にする親族などへの譲渡には使えない。前年・前々年にこの特例や買換え特例を受けていれば使えない", "kind": "row", "id": "c356"}, {"sec": 25, "sub": "譲渡所得（居住用財産の特例）", "front": "軽減税率", "back": "1月1日で所有期間<b>10年超</b>。課税長期譲渡所得のうち<b>6,000万円以下</b>の部分は10%（超える部分は15%）。3,000万円控除と<b>併用できる</b>", "kind": "row", "id": "c357"}, {"sec": 25, "sub": "譲渡所得（居住用財産の特例）", "front": "特定の居住用財産の買換え特例", "back": "譲渡資産：所有期間<b>10年超</b>・居住期間10年以上・譲渡対価<b>1億円以下</b>／買換資産：床面積<b>50㎡以上</b>（上限なし）・敷地500㎡以下、譲渡した<b>前年</b>の1月1日から<b>翌年</b>12月31日までに取得／3,000万円控除・軽減税率とは<b>併用できない</b>", "kind": "row", "id": "c358"}, {"sec": 25, "sub": "登録免許税（住宅用家屋の所有権移転登記の軽減）", "front": "床面積", "back": "<b>50㎡以上</b>", "kind": "row", "id": "c359"}, {"sec": 25, "sub": "登録免許税（住宅用家屋の所有権移転登記の軽減）", "front": "登記の時期", "back": "取得後 <b>1年以内</b>に登記を受ける", "kind": "row", "id": "c360"}, {"sec": 25, "sub": "登録免許税（住宅用家屋の所有権移転登記の軽減）", "front": "対象となる取得原因", "back": "<b>売買または競売のみ</b>（贈与・遺贈・相続は対象外）", "kind": "row", "id": "c361"}, {"sec": 25, "sub": "登録免許税（住宅用家屋の所有権移転登記の軽減）", "front": "対象となる不動産", "back": "<b>家屋のみ</b>（敷地の土地には適用がない）", "kind": "row", "id": "c362"}, {"sec": 25, "sub": "登録免許税（住宅用家屋の所有権移転登記の軽減）", "front": "課税標準", "back": "<b>固定資産課税台帳の登録価格</b>（実際の取引価格ではない）。抵当権設定登記は<b>債権金額</b>", "kind": "row", "id": "c363"}, {"sec": 25, "sub": "登録免許税（住宅用家屋の所有権移転登記の軽減）", "front": "納税義務者", "back": "登記を受ける者。共同申請なら<b>連帯</b>して納付する", "kind": "row", "id": "c364"}, {"sec": 25, "sub": "登録免許税（住宅用家屋の所有権移転登記の軽減）", "front": "過去に軽減を受けた者", "back": "<b>再び適用を受けられる</b>", "kind": "row", "id": "c365"}, {"sec": 26, "sub": "区域区分", "front": "市街化区域＝すでに市街地を形成している区域、および <span class=\"gap\">①</span> に優先的かつ計画的に市街化を図るべき区域。用途地域は <span class=\"gap\">②</span> 定める。", "back": "市街化区域＝すでに市街地を形成している区域、および <mark>おおむね10年以内</mark> に優先的かつ計画的に市街化を図るべき区域。用途地域は <mark>少なくとも</mark> 定める。", "kind": "cloze", "id": "c366"}, {"sec": 26, "sub": "区域区分", "front": "市街化調整区域＝市街化を <span class=\"gap\">①</span> すべき区域。用途地域は <span class=\"gap\">②</span>。", "back": "市街化調整区域＝市街化を <mark>抑制</mark> すべき区域。用途地域は <mark>原則として定めない</mark>。", "kind": "cloze", "id": "c367"}, {"sec": 26, "sub": "区域区分", "front": "都市計画区域は、上記のほか首都圏整備法・近畿圏整備法・中部圏開発整備法の都市開発区域等にも指定できるので、「〜に該当する区域に限り指定される」は <span class=\"gap\">①</span>。また <span class=\"gap\">②</span> 指定することもできる。", "back": "都市計画区域は、上記のほか首都圏整備法・近畿圏整備法・中部圏開発整備法の都市開発区域等にも指定できるので、「〜に該当する区域に限り指定される」は <mark>誤り</mark>。また <mark>市町村や都府県の区域を越えて</mark> 指定することもできる。", "kind": "cloze", "id": "c368"}, {"sec": 26, "sub": "地域地区", "front": "用途地域は <span class=\"gap\">①</span> 種類。", "back": "用途地域は <mark>13</mark> 種類。", "kind": "cloze", "id": "c369"}, {"sec": 26, "sub": "地域地区", "front": "高度地区＝建築物の <span class=\"gap\">①</span> の最高限度・最低限度を定める。", "back": "高度地区＝建築物の <mark>高さ</mark> の最高限度・最低限度を定める。", "kind": "cloze", "id": "c370"}, {"sec": 26, "sub": "地域地区", "front": "高度利用地区＝ <span class=\"gap\">①</span> の最高・最低、建蔽率の最高、建築面積の最低を定める。", "back": "高度利用地区＝ <mark>容積率</mark> の最高・最低、建蔽率の最高、建築面積の最低を定める。", "kind": "cloze", "id": "c371"}, {"sec": 26, "sub": "地域地区", "front": "特別用途地区＝ <span class=\"gap\">①</span> で、特別の目的から用途制限を補完する。", "back": "特別用途地区＝ <mark>用途地域内</mark> で、特別の目的から用途制限を補完する。", "kind": "cloze", "id": "c372"}, {"sec": 26, "sub": "地域地区", "front": "特定用途制限地域＝ <span class=\"gap\">①</span>（<span
